<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>得獎榮譽狀 · n8n Taiwan Open Hackathon 2026</title>
<meta name="description" content="n8n Taiwan Open Hackathon 2026 · 決賽得獎榮譽狀 · 可線上驗真 · 掃 QR code 即刻查證">
<meta property="og:title" content="n8n Taiwan Open Hackathon 2026 · 得獎榮譽狀">
<meta property="og:description" content="首屆 n8n 台灣官方黑客松得獎榮譽狀 · 由 AI 評審團實機驗證作品 · 官方發放">
<meta property="og:type" content="article">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://unpkg.com/lucide@latest" onerror="window.lucideFailed=true"></script>
<style>
  :root {
    --pink: #F0648C;
    --pink-deep: #EA4B71;
    --gold: #C9A961;
    --gold-deep: #A88540;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --ink-light: #7a7a7a;
    --paper: #FFFFFF;
    --paper-soft: #FAFAF7;
    --line: #E8E2D0;

    /* Tier 主色(JS 會依獎項套用 class 到 .cert · 覆蓋以下 CSS 變數) */
    --tier-primary: #C9A961;   /* 預設 · 特別獎用 pink */
    --tier-deep:    #A88540;
    --tier-soft:    #FFF8E5;
    --tier-label:   'AWARD';

    --font-body: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial,
                 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
    --font-title: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial,
                  'Songti TC', 'PMingLiU', 'MingLiU', 'Noto Serif TC', serif;
    --font-en: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
    --cert-w: 800px;
    --cert-h: 1131px;
  }
  /* 獎項 tier 色系 */
  .tier-grand   { --tier-primary: #D4AF37; --tier-deep: #A17E14; --tier-soft: #FFF8DC; }
  .tier-silver  { --tier-primary: #B8B8B8; --tier-deep: #6E6E6E; --tier-soft: #F5F5F5; }
  .tier-bronze  { --tier-primary: #C08155; --tier-deep: #7A4A2B; --tier-soft: #FBEDE0; }
  .tier-special { --tier-primary: #F0648C; --tier-deep: #A02C4E; --tier-soft: #FFF1F6; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: var(--font-body); }
  body {
    background: #ECEBE6;
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding: 24px 20px;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  .topbar {
    max-width: var(--cert-w);
    margin: 0 auto 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 8px;
  }
  .topbar a { color: var(--ink-soft); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .topbar a:hover { color: var(--pink-deep); }
  .topbar svg { width: 14px; height: 14px; }

  .cert-wrap {
    overflow-x: auto;
    overflow-y: hidden;
    padding: 0;
    -webkit-overflow-scrolling: touch;
  }
  .cert-scaler {
    width: var(--cert-w);
    height: var(--cert-h);
    margin: 0 auto;
  }
  .cert {
    width: var(--cert-w);
    height: var(--cert-h);
    background: var(--paper);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 2px 6px rgba(0, 0, 0, 0.05);
    position: relative;
    overflow: hidden;
  }
  /* 更粗的雙邊框 · 用 tier 主色 · 突出獎狀質感 */
  .cert::before {
    content: '';
    position: absolute;
    top: 18px; left: 18px; right: 18px; bottom: 18px;
    border: 3px solid var(--tier-primary);
    pointer-events: none;
  }
  .cert::after {
    content: '';
    position: absolute;
    top: 26px; left: 26px; right: 26px; bottom: 26px;
    border: 1px solid var(--tier-primary);
    opacity: 0.5;
    pointer-events: none;
  }
  .cert-inner {
    position: relative;
    padding: 44px 56px 30px;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ============ HEADER ============ */
  .cert-header { text-align: center; }
  .cert-brand {
    font-weight: 900;
    font-size: 14px;
    color: var(--pink-deep);
    margin-bottom: 3px;
  }
  .cert-brand-cn {
    font-size: 11px;
    color: var(--ink-light);
    margin-bottom: 16px;
  }
  .cert-title-en {
    font-family: var(--font-en);
    font-size: 13px;
    color: var(--tier-deep);
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }
  .cert-title {
    font-family: var(--font-title);
    font-size: 36px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.15;
    letter-spacing: 0.08em;
  }

  /* ============ AWARD DISPLAY(主視覺) ============ */
  .award-display {
    text-align: center;
    padding: 14px 0;
    background: linear-gradient(180deg, var(--tier-soft) 0%, transparent 100%);
    border-top: 1px solid var(--tier-primary);
    border-bottom: 1px solid var(--tier-primary);
  }
  .award-medal-row {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    color: var(--tier-primary);
    margin-bottom: 6px;
  }
  .award-medal-row svg { width: 34px; height: 34px; }
  .award-medal-row .medal-lines {
    display: flex;
    gap: 4px;
  }
  .award-medal-row .medal-lines span {
    width: 32px;
    height: 2px;
    background: var(--tier-primary);
    opacity: 0.4;
  }
  .award-name {
    font-family: var(--font-title);
    font-size: 48px;
    font-weight: 900;
    color: var(--tier-deep);
    letter-spacing: 0.2em;
    padding-left: 0.2em;
    line-height: 1;
    margin: 4px 0;
  }
  .award-subtitle {
    font-family: var(--font-en);
    font-size: 12px;
    color: var(--tier-deep);
    letter-spacing: 0.25em;
    opacity: 0.85;
    font-weight: 600;
  }

  /* ============ RECIPIENT ============ */
  .cert-recipient {
    text-align: center;
    padding: 8px 0;
  }
  .cert-tzh {
    font-family: var(--font-title);
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 10px;
    letter-spacing: 0.4em;
    padding-left: 0.4em;
  }
  .cert-name-wrap {
    display: inline-block;
    padding: 10px 60px 8px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    min-width: 380px;
  }
  .cert-name {
    font-family: var(--font-title);
    font-size: 36px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.15em;
    padding-left: 0.15em;
    display: inline-block;
  }
  .cert-role-badge {
    display: inline-block;
    margin-left: 14px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.15em;
    vertical-align: 12px;
  }
  .cert-school {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink-light);
    margin-top: 10px;
    letter-spacing: 0.05em;
  }

  /* ============ STATEMENT ============ */
  .cert-statement {
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.95;
    color: var(--ink);
    text-align: center;
    padding: 0 18px;
  }
  .cert-statement strong { font-weight: 900; color: var(--tier-deep); }
  .cert-statement .work-title { font-weight: 700; color: var(--ink); }

  /* ============ WITNESSES ============ */
  .cert-witnesses {
    border-top: 1px solid var(--gold);
    border-bottom: 1px solid var(--gold);
    padding: 8px 16px;
    background: linear-gradient(180deg, transparent 0%, rgba(201, 169, 97, 0.04) 100%);
  }
  .cert-witnesses-label {
    text-align: center;
    font-family: var(--font-en);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--gold-deep);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .cert-witnesses-list {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .cert-witness { text-align: center; }
  .cert-witness-name {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 12px;
    color: var(--ink);
    line-height: 1.25;
    margin-bottom: 2px;
  }
  .cert-witness-role {
    font-family: var(--font-body);
    font-size: 9.5px;
    color: var(--ink-light);
    line-height: 1.4;
    white-space: nowrap;
    text-wrap: pretty;
  }

  /* ============ SIGNATURES ============ */
  .cert-sigs {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 24px;
    align-items: flex-end;
    padding: 4px 8px 0;
  }
  .cert-sig { text-align: center; }
  .cert-sig-image-slot {
    height: 60px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    margin-bottom: 8px;
  }
  .cert-sig-image {
    max-height: 60px;
    max-width: 220px;
    width: auto;
    height: auto;
    display: block;
  }
  .cert-sig-image.tigerai-logo { max-width: 200px; }
  .cert-sig-line {
    height: 1.5px;
    background: var(--ink);
    max-width: 220px;
    margin: 0 auto 8px;
  }
  .cert-sig-role {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--ink-light);
    line-height: 1.55;
  }
  .cert-sig-role strong { color: var(--ink); font-weight: 700; font-size: 12px; }

  .cert-verify {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .cert-qr {
    background: #fff;
    padding: 3px;
    border: 1px solid var(--line);
  }
  .cert-qr img { width: 82px; height: 82px; display: block; }
  .cert-qr-label {
    font-family: var(--font-en);
    font-size: 9px;
    color: var(--ink-light);
    letter-spacing: 0.1em;
    font-weight: 600;
  }

  /* ============ FOOTER ============ */
  .cert-footstrip {
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .cert-meta {
    font-family: var(--font-body);
    font-size: 10px;
    color: var(--ink-light);
    line-height: 1.7;
    text-align: center;
  }
  .cert-meta strong { color: var(--ink-soft); font-weight: 700; }
  .cert-meta code {
    font-family: var(--font-mono);
    background: var(--paper-soft);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--tier-deep);
    font-size: 10px;
  }
  .cert-sponsors {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
  }
  .cert-sponsors img {
    height: 22px;
    max-width: 90px;
    object-fit: contain;
    filter: grayscale(1) contrast(1.05);
    opacity: 0.72;
  }

  /* ============ ACTIONS ============ */
  .actions {
    max-width: var(--cert-w);
    margin: 20px auto 0;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 11px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    font-family: var(--font-body);
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s ease;
    color: var(--ink);
  }
  .btn svg { width: 14px; height: 14px; }
  .btn-primary { background: linear-gradient(135deg, var(--tier-primary) 0%, var(--tier-deep) 100%); color: #fff; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
  .btn-ghost { background: #fff; border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--paper-soft); border-color: var(--tier-primary); }

  /* ============ STATES ============ */
  .loading, .error {
    max-width: 560px;
    margin: 80px auto;
    padding: 60px 40px;
    background: #fff;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
  }
  .loading svg { width: 40px; height: 40px; color: var(--pink); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error svg { width: 48px; height: 48px; color: #d94a4a; margin-bottom: 12px; }
  .error h2 { font-family: var(--font-body); font-size: 22px; color: var(--ink); margin-bottom: 8px; }
  .error p { color: var(--ink-light); font-size: 14px; margin-bottom: 20px; }
  .error code { font-family: var(--font-mono); background: var(--paper-soft); padding: 2px 8px; border-radius: 4px; }

  /* ============ PRINT ============ */
  @page {
    size: 800px 1131px;
    margin: 0;
  }
  @media print {
    html, body {
      background: #fff !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    .topbar, .actions { display: none !important; }
    .cert-wrap {
      overflow: visible !important;
      padding: 0 !important;
      margin: 0 !important;
      max-width: none !important;
    }
    .cert-scaler, .cert {
      box-shadow: none !important;
      margin: 0 !important;
      page-break-after: avoid !important;
      page-break-inside: avoid !important;
    }
    .cert::before, .cert::after {
      top: 12px !important; left: 12px !important; right: 12px !important; bottom: 12px !important;
    }
  }
</style>
</head>
<body>

<nav class="topbar" id="topbar">
  <a href="index.html"><i data-lucide="chevron-left"></i><span>回活動首頁</span></a>
  <a href="ai-review.html"><span>看 AI 評審團報告</span><i data-lucide="arrow-right"></i></a>
</nav>

<main id="app">
  <div class="loading">
    <i data-lucide="loader-2"></i>
    <p style="margin-top:16px; color:var(--ink-light); font-size:14px;">正在讀取獎狀資料…</p>
  </div>
</main>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxgSAroD9N2Bs3-kKj5WV2oyFuMpznthbyujiRa3Q9SV3qH2PfdwgP2mx3wEMFLjgj7TQ/exec';
const MODE_LABEL = { onsite: '現場出席', remote: '遠端連線' };

// tier → 英文獎項名(顯示在中文獎項下方)
const TIER_EN = {
  grand:   'GRAND PRIZE · 1st Place',
  silver:  'SILVER MEDAL · 2nd Place',
  bronze:  'BRONZE MEDAL · 3rd Place',
  special: 'SPECIAL AWARD'
};

function getParam(name) {
  return new URLSearchParams(location.search).get(name) || '';
}
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderError(msg, certId) {
  document.getElementById('app').innerHTML = `
    <div class="error">
      <i data-lucide="x-circle"></i>
      <h2>找不到此獎狀</h2>
      <p>${esc(msg)}</p>
      ${certId ? `<p>查詢的證書 ID: <code>${esc(certId)}</code></p>` : ''}
      <a href="index.html" class="btn btn-primary" style="margin-top:8px; text-decoration:none;">
        <i data-lucide="home"></i><span>回活動首頁</span>
      </a>
    </div>
  `;
  if (window.lucide) lucide.createIcons();
}

function renderCert(cert) {
  const modeLabel = MODE_LABEL[cert.mode] || '現場出席';
  const certUrl = location.origin + location.pathname + '?id=' + cert.id;
  const aiReviewUrl = location.origin + '/ai-review.html';
  const partUrl = location.origin + '/cert.html?id=' + cert.id.replace('AWD-', '');   // 對應的參賽證明
  const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=' + encodeURIComponent(certUrl);
  const qrFallback = 'https://chart.googleapis.com/chart?cht=qr&chs=200x200&chld=M|0&chl=' + encodeURIComponent(certUrl);

  document.title = `${cert.recipientName} · ${cert.award.displayName} · n8n Taiwan Open 2026`;

  const tierClass = 'tier-' + (cert.award.tier || 'special');
  const tierEn = TIER_EN[cert.award.tier] || 'AWARD';

  // 獎項顯示名:special-* 用 specialSubtitle(如「AMD 特別獎」) · 否則用 displayName
  const bigAwardName = (cert.award.tier === 'special' && cert.award.specialSubtitle)
    ? cert.award.specialSubtitle
    : cert.award.displayName;

  document.getElementById('app').innerHTML = `
    <div class="cert-wrap">
      <div class="cert-scaler">
        <article class="cert ${tierClass}">
          <div class="cert-inner">

            <header class="cert-header">
              <div class="cert-brand">n8n · TAIWAN OPEN HACKATHON</div>
              <div class="cert-brand-cn">2026 首屆 · 全台大專院校 n8n 自動化黑客松</div>
              <div class="cert-title-en">CERTIFICATE OF ACHIEVEMENT</div>
              <h1 class="cert-title">得獎榮譽狀</h1>
            </header>

            <!-- AWARD DISPLAY -->
            <div class="award-display">
              <div class="award-medal-row">
                <span class="medal-lines"><span></span><span></span></span>
                <i data-lucide="award"></i>
                <span class="medal-lines"><span></span><span></span></span>
              </div>
              <div class="award-name">${esc(bigAwardName)}</div>
              <div class="award-subtitle">${esc(tierEn)}</div>
            </div>

            <!-- RECIPIENT -->
            <section class="cert-recipient">
              <div class="cert-tzh">頒 予</div>
              <div class="cert-name-wrap">
                <span class="cert-name">${esc(cert.recipientName)}</span>
                <span class="cert-role-badge">${cert.isLeader ? '隊長' : '隊員'}</span>
              </div>
              ${cert.school ? `<div class="cert-school">${esc(cert.school)}</div>` : ''}
            </section>

            <p class="cert-statement">
              於 <strong>2026 年 8 月 7 日</strong> 於 t.Hub Taipei 舉辦之
              n8n Taiwan Open Hackathon 2026 首屆決賽中 ·
              所屬「<strong>${esc(cert.teamName)}</strong>」以
              <span class="work-title">《${esc(cert.workTitle)}》</span>
              為題完成之 AI 自動化作品 · 經主辦方 AI 評審團(Claude · Codex · Gemini)實機驗證
              與業界評審共同評選 · <strong>榮獲「${esc(cert.award.displayName)}」</strong> ·
              特頒此狀 · 以資鼓勵。
            </p>

            <!-- WITNESSES -->
            <section class="cert-witnesses">
              <div class="cert-witnesses-label">業界評審共同見證 · CO-WITNESSED BY THE JUDGING PANEL</div>
              <div class="cert-witnesses-list">
                <div class="cert-witness">
                  <div class="cert-witness-name">欒斌 教授</div>
                  <div class="cert-witness-role">臺科大企管系 · 教育部師鐸獎</div>
                </div>
                <div class="cert-witness">
                  <div class="cert-witness-name">游文賢 理事長</div>
                  <div class="cert-witness-role">中華亞太智慧物聯發展協會</div>
                </div>
                <div class="cert-witness">
                  <div class="cert-witness-name">陳鵬如</div>
                  <div class="cert-witness-role">撼訊集團 總經理特助</div>
                </div>
                <div class="cert-witness">
                  <div class="cert-witness-name">林穎彥</div>
                  <div class="cert-witness-role">AMD 軟體開發工程師</div>
                </div>
                <div class="cert-witness">
                  <div class="cert-witness-name">林毓晟</div>
                  <div class="cert-witness-role">晟景科技</div>
                </div>
              </div>
            </section>

            <!-- SIGNATURES + QR -->
            <section class="cert-sigs">
              <div class="cert-sig">
                <div class="cert-sig-image-slot">
                  <img class="cert-sig-image" src="assets/signatures/morris.jpg" alt="Morris 盧業興 簽名">
                </div>
                <div class="cert-sig-line"></div>
                <div class="cert-sig-role">
                  <strong>Morris 盧業興</strong><br>
                  n8n 台灣首位官方 Ambassador · TigerAI 執行長
                </div>
              </div>
              <div class="cert-sig">
                <div class="cert-sig-image-slot">
                  <img class="cert-sig-image tigerai-logo" src="assets/logos/tigerai.png" alt="TigerAI">
                </div>
                <div class="cert-sig-line"></div>
                <div class="cert-sig-role">
                  <strong>虎智科技股份有限公司</strong><br>
                  n8n Taiwan Open Hackathon 主辦單位 · 統一編號 93489997
                </div>
              </div>
              <div class="cert-verify">
                <div class="cert-qr">
                  <img id="qrImg" alt="Verify QR" width="82" height="82"
                       src="${qrSrc}"
                       onerror="this.onerror=null;this.src='${qrFallback}'">
                </div>
                <div class="cert-qr-label">SCAN TO VERIFY</div>
              </div>
            </section>

            <!-- FOOTER STRIP -->
            <section class="cert-footstrip">
              <div class="cert-meta">
                <strong>證書序號</strong> · <code>${esc(cert.id)}</code> ·
                <strong>頒發日期</strong> · 2026 年 8 月 8 日 ·
                <strong>線上驗證</strong> · ${esc(certUrl)}
              </div>
              <div class="cert-sponsors">
                <img src="assets/logos/drmaster.png" alt="博碩文化">
                <img src="assets/logos/ntust-incubator.png" alt="臺科大創新育成中心">
                <img src="assets/logos/n8n.svg" alt="n8n">
                <img src="assets/logos/amd.png" alt="AMD">
                <img src="assets/logos/tul.png" alt="TUL">
                <img src="assets/logos/zeabur.svg" alt="Zeabur">
                <img src="assets/logos/aiot-association.jpg" alt="中華亞太智慧物聯發展協會">
                <img src="assets/logos/t-hub-taipei.png" alt="t.Hub Taipei">
              </div>
            </section>

          </div>
        </article>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-primary" onclick="window.print()">
        <i data-lucide="printer"></i><span>列印 / 存 PDF · A4 直式</span>
      </button>
      <button type="button" class="btn btn-ghost" onclick="copyLink()">
        <i data-lucide="link"></i><span>複製證書連結</span>
      </button>
      <a class="btn btn-ghost" href="${partUrl}" target="_blank" rel="noopener">
        <i data-lucide="file-text"></i><span>你也有一張參賽證明</span>
      </a>
      <a class="btn btn-ghost" href="${aiReviewUrl}#${cert.teamId}" target="_blank" rel="noopener">
        <i data-lucide="cpu"></i><span>看本隊 AI 評審評論</span>
      </a>
      <a class="btn btn-ghost" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(certUrl)}" target="_blank" rel="noopener">
        <i data-lucide="linkedin"></i><span>分享到 LinkedIn</span>
      </a>
    </div>
  `;

  if (window.lucide) lucide.createIcons();
}

window.copyLink = async function() {
  const url = location.href;
  try {
    await navigator.clipboard.writeText(url);
    alert('證書連結已複製 · 貼到 LinkedIn / 履歷 / email 都可以');
  } catch (e) {
    prompt('請複製這個網址', url);
  }
};

const certId = getParam('id');
if (!certId) {
  renderError('網址缺少 id 參數 · 應為 award-cert.html?id=2026-NTO-AWD-T00X-YY');
} else {
  fetch(GAS_URL + '?action=award-cert-lookup&id=' + encodeURIComponent(certId))
    .then(r => r.json())
    .then(data => {
      if (data && data.ok && data.cert) {
        try { renderCert(data.cert); }
        catch (e) { console.error('render failed', e); renderError('證書顯示異常 · ' + e.message, certId); }
      } else {
        renderError(data && data.message ? data.message : '無法讀取獎狀資料', certId);
      }
    })
    .catch(err => {
      console.error('cert lookup failed', err);
      renderError('連線暫時有問題 · 請稍後再試 · ' + err.message, certId);
    });
}

if (window.lucide) lucide.createIcons();
</script>

</body>
</html>
