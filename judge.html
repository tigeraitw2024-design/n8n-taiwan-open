<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>評審評分 · n8n Taiwan Open Hackathon 2026</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --pink: #F0648C;
    --pink-deep: #EA4B71;
    --pink-soft: #FFF5F5;
    --pink-bg: #FFECF2;
    --black: #0D0D0D;
    --white: #FFFFFF;
    --gray-50: #F9FAFB;
    --gray-100: #F3F4F6;
    --gray-200: #E5E7EB;
    --gray-300: #D1D5DB;
    --gray-400: #9CA3AF;
    --gray-500: #6B7280;
    --gray-600: #4B5563;
    --gray-700: #374151;
    --gray-800: #1F2937;
    --green: #10B981;
    --amber: #F59E0B;
    --red: #EF4444;
    --font-display: 'Satoshi', 'Noto Sans TC', -apple-system, system-ui, sans-serif;
    --font-body: 'Noto Sans TC', 'Satoshi', -apple-system, system-ui, sans-serif;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--gray-50);
    color: var(--gray-800);
    line-height: 1.6;
    min-height: 100vh;
  }
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--gray-200);
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--gray-800);
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .brand:hover { opacity: 0.75; }
  .brand-logo-mark {
    font-size: 22px;
    font-weight: 900;
    color: var(--pink-deep);
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .brand-logo-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-600);
  }
  .brand-divider {
    width: 1px;
    height: 20px;
    background: var(--gray-200);
    margin: 0 2px;
  }
  .brand-pill {
    padding: 4px 10px;
    border-radius: 100px;
    background: var(--pink-bg);
    color: var(--pink-deep);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .judge-info {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: var(--gray-600);
  }
  .judge-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    color: var(--white);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
  }
  .btn-tiny {
    background: transparent;
    border: 1px solid var(--gray-300);
    color: var(--gray-600);
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font-display);
    font-weight: 600;
  }
  .btn-tiny:hover { background: var(--gray-100); }
  .lang-btn {
    padding: 6px 14px;
    border-radius: 100px;
    border: 1px solid var(--gray-300);
    background: var(--white);
    color: var(--gray-700);
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .lang-btn:hover { border-color: var(--pink-deep); color: var(--pink-deep); }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  .status-banner {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-radius: var(--radius-md);
    background: var(--pink-soft);
    color: var(--gray-800);
    margin-bottom: 24px;
    font-size: 14px;
  }
  .status-banner svg { flex-shrink: 0; width: 20px; height: 20px; color: var(--pink-deep); }
  .status-banner.status-error { background: #FEF2F2; }
  .status-banner.status-error svg { color: var(--red); }
  .status-banner.status-ok { background: #ECFDF5; }
  .status-banner.status-ok svg { color: var(--green); }

  /* n8n Learning 共用帳號提示 */
  .learning-banner {
    background: linear-gradient(135deg, #FFF7ED 0%, #FEF3C7 100%);
    border: 1px solid #FCD34D;
    border-radius: var(--radius-md);
    padding: 16px 20px;
    margin-bottom: 24px;
    font-size: 13px;
    color: var(--gray-800);
  }
  .learning-banner-head {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    color: #92400E;
    margin-bottom: 10px;
  }
  .learning-banner-head svg { width: 18px; height: 18px; }
  .learning-banner-grid {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 8px 12px;
    align-items: center;
  }
  .learning-banner-grid .label { color: var(--gray-500); font-size: 12px; }
  .learning-banner-grid .value {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px;
    color: var(--black);
    word-break: break-all;
  }
  .learning-banner-grid .value a { color: var(--pink-deep); text-decoration: none; }
  .learning-banner-grid .value a:hover { text-decoration: underline; }
  .learning-copy-btn {
    padding: 4px 10px;
    background: #fff;
    border: 1px solid #FCD34D;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    color: #92400E;
    cursor: pointer;
    font-family: inherit;
  }
  .learning-copy-btn:hover { background: #FEF3C7; }
  .learning-copy-btn.copied { background: #10B981; color: #fff; border-color: #10B981; }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    background: var(--white);
    border-radius: var(--radius-lg);
    border: 1px solid var(--gray-200);
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .progress-stats { display: flex; gap: 32px; }
  .progress-stat-label {
    font-size: 12px;
    color: var(--gray-500);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
  }
  .progress-stat-value {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--gray-800);
  }
  .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-tab {
    padding: 8px 16px;
    border-radius: 100px;
    background: var(--gray-100);
    color: var(--gray-600);
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }
  .filter-tab:hover { background: var(--gray-200); }
  .filter-tab.active { background: var(--pink-deep); color: var(--white); }
  .team-list { display: grid; gap: 16px; }
  .team-card {
    background: var(--white);
    border: 2px solid var(--gray-200);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: all 0.2s;
  }
  .team-card:hover { border-color: var(--pink); box-shadow: 0 8px 24px rgba(240, 100, 140, 0.08); }
  .team-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 24px; cursor: pointer; gap: 16px;
  }
  .team-header-left { display: flex; align-items: center; gap: 16px; min-width: 0; flex: 1; }
  .team-idx {
    width: 40px; height: 40px; border-radius: var(--radius-sm);
    background: var(--gray-100); color: var(--gray-700);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  .team-title-block { min-width: 0; }
  .team-name {
    font-family: var(--font-display); font-weight: 700; font-size: 17px;
    color: var(--gray-800); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .team-theme-tag {
    padding: 2px 10px; border-radius: 100px;
    background: var(--pink-bg); color: var(--pink-deep);
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
  }
  .team-title-sub { font-size: 13px; color: var(--gray-500); margin-top: 4px; }
  .team-status {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-display); font-size: 13px; font-weight: 600;
    padding: 6px 12px; border-radius: 100px;
  }
  .team-status.status-pending { background: var(--gray-100); color: var(--gray-500); }
  .team-status.status-scored { background: #ECFDF5; color: var(--green); }
  .team-status svg { width: 14px; height: 14px; }
  .team-body { display: none; padding: 0 24px 24px; border-top: 1px solid var(--gray-200); }
  .team-card.expanded .team-body { display: block; }
  .team-card.expanded .expand-icon { transform: rotate(180deg); }
  .expand-icon { transition: transform 0.2s; color: var(--gray-400); }

  .team-meta {
    padding: 20px 0;
    border-bottom: 1px solid var(--gray-200);
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .team-meta-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }
  .team-meta-item { font-size: 13px; }
  .team-meta-label {
    font-size: 11px; color: var(--gray-500); text-transform: uppercase;
    letter-spacing: 0.08em; font-weight: 700; margin-bottom: 4px;
  }
  .team-meta-value { color: var(--gray-800); word-break: break-word; }
  .team-meta-value a { color: var(--pink-deep); text-decoration: none; font-weight: 600; }
  .team-meta-value a:hover { text-decoration: underline; }

  .team-block {
    background: var(--gray-50);
    border-radius: var(--radius-md);
    padding: 16px 20px;
  }
  .team-block-title {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 700;
    color: var(--gray-500);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .team-block-title svg { width: 14px; height: 14px; color: var(--pink-deep); }

  .members-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 10px;
  }
  .member-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
    font-size: 13px;
  }
  .member-chip-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--pink-bg); color: var(--pink-deep);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 11px; font-weight: 700;
    flex-shrink: 0;
  }
  .member-chip-body { min-width: 0; flex: 1; }
  .member-chip-name {
    font-family: var(--font-display); font-weight: 600; color: var(--gray-800);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .member-chip-meta { font-size: 11.5px; color: var(--gray-500); }

  .certs-gallery {
    display: flex; flex-wrap: wrap; gap: 10px;
  }
  .cert-tile {
    width: 88px; height: 88px; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); background: var(--white);
    overflow: hidden; cursor: pointer; position: relative;
    transition: transform 0.15s;
  }
  .cert-tile:hover { transform: scale(1.05); }
  .cert-tile img { width: 100%; height: 100%; object-fit: cover; }
  .cert-tile-fallback {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--gray-400); flex-direction: column; gap: 4px;
    font-size: 10px; padding: 4px;
  }
  .cert-tile-fallback svg { width: 22px; height: 22px; }

  .file-btns {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .file-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: var(--radius-sm);
    background: var(--white); border: 1px solid var(--gray-200);
    color: var(--gray-700); text-decoration: none;
    font-family: var(--font-display); font-weight: 600; font-size: 12.5px;
    max-width: 100%; overflow: hidden;
  }
  .file-btn:hover { border-color: var(--pink); color: var(--pink-deep); }
  .file-btn svg { width: 13px; height: 13px; stroke-width: 2.2; flex-shrink: 0; }
  .file-btn-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .runtime-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 100px;
    background: var(--pink-bg); color: var(--pink-deep);
    font-family: var(--font-display); font-size: 12px; font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  .runtime-detail {
    font-size: 13px; color: var(--gray-700); line-height: 1.6;
  }
  .runtime-detail a {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--pink-deep); font-weight: 600; text-decoration: none;
    padding: 6px 12px; background: var(--white); border-radius: 100px; border: 1px solid var(--pink-bg);
    margin-top: 6px;
  }
  .runtime-detail a:hover { background: var(--pink-soft); }
  .runtime-detail a svg { width: 12px; height: 12px; }
  .runtime-local-deps {
    font-family: monospace; font-size: 12px;
    background: var(--white); padding: 10px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200); white-space: pre-wrap; word-break: break-word;
    margin-top: 8px;
  }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
    display: none; align-items: center; justify-content: center; z-index: 500;
    padding: 20px; cursor: pointer;
  }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: var(--radius-md); }

  .score-grid { display: grid; gap: 24px; }
  .score-row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .score-label { font-family: var(--font-display); font-weight: 600; color: var(--gray-800); font-size: 15px; }
  .score-weight { font-size: 12px; color: var(--gray-500); font-weight: 700; letter-spacing: 0.05em; }
  .score-desc { font-size: 12.5px; color: var(--gray-500); margin-bottom: 10px; line-height: 1.5; }
  .score-slider-row { display: flex; align-items: center; gap: 16px; }
  .score-slider {
    flex: 1; -webkit-appearance: none; height: 8px; border-radius: 4px;
    background: var(--gray-200); outline: none; cursor: pointer;
  }
  .score-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
    background: var(--pink-deep); cursor: pointer; box-shadow: 0 2px 6px rgba(240, 100, 140, 0.4);
  }
  .score-slider::-moz-range-thumb {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--pink-deep); cursor: pointer; border: none;
  }
  .score-value-input {
    width: 72px; padding: 8px 10px; border: 2px solid var(--gray-200); border-radius: var(--radius-sm);
    font-family: var(--font-display); font-weight: 700; font-size: 18px; text-align: center; color: var(--pink-deep);
  }
  .score-value-input:focus { outline: none; border-color: var(--pink-deep); }
  .score-value-max { color: var(--gray-400); font-size: 14px; font-weight: 600; }

  .total-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 24px;
    background: linear-gradient(135deg, var(--pink-soft) 0%, var(--pink-bg) 100%);
    border-radius: var(--radius-md); margin-top: 24px;
  }
  .total-label { font-family: var(--font-display); font-weight: 700; color: var(--gray-800); }
  .total-value {
    font-family: var(--font-display); font-size: 36px; font-weight: 900;
    color: var(--pink-deep); line-height: 1;
  }
  .total-value .max { font-size: 18px; font-weight: 600; color: var(--gray-500); }

  .note-block { margin-top: 24px; }
  .note-label { font-family: var(--font-display); font-weight: 600; color: var(--gray-800); font-size: 14px; margin-bottom: 8px; }
  .note-textarea {
    width: 100%; padding: 12px; border: 2px solid var(--gray-200); border-radius: var(--radius-sm);
    font-family: var(--font-body); font-size: 14px; resize: vertical; min-height: 80px;
  }
  .note-textarea:focus { outline: none; border-color: var(--pink-deep); }

  .submit-row { display: flex; gap: 12px; margin-top: 24px; }
  .btn {
    padding: 12px 24px; border-radius: var(--radius-sm); font-family: var(--font-display);
    font-weight: 700; font-size: 14px; cursor: pointer; border: none; transition: all 0.15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn svg { width: 16px; height: 16px; stroke-width: 2.2; }
  .btn-primary { background: var(--pink-deep); color: var(--white); }
  .btn-primary:hover { background: var(--pink); }
  .btn-primary:disabled { background: var(--gray-300); cursor: not-allowed; }
  .btn-secondary { background: var(--gray-100); color: var(--gray-700); }
  .btn-secondary:hover { background: var(--gray-200); }
  .btn-full { width: 100%; }

  /* ---- Auth screen ---- */
  .auth-wrap {
    max-width: 520px;
    margin: 60px auto 0;
    padding: 0 24px;
  }
  .auth-card {
    background: var(--white);
    border-radius: var(--radius-xl);
    border: 1px solid var(--gray-200);
    padding: 40px 32px;
  }
  .auth-title {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 700;
    color: var(--gray-800);
    margin-bottom: 8px;
    text-align: center;
  }
  .auth-sub {
    color: var(--gray-500);
    font-size: 14px;
    text-align: center;
    margin-bottom: 32px;
  }
  .auth-step {
    display: flex;
    gap: 16px;
    padding: 20px;
    border-radius: var(--radius-md);
    background: var(--gray-50);
    margin-bottom: 16px;
    align-items: flex-start;
  }
  .auth-step-num {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--pink-deep);
    color: var(--white);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
  }
  .auth-step.done .auth-step-num {
    background: var(--green);
  }
  .auth-step-body { flex: 1; min-width: 0; }
  .auth-step-label {
    font-family: var(--font-display);
    font-weight: 600;
    color: var(--gray-800);
    font-size: 15px;
    margin-bottom: 12px;
  }
  #gsiButton {
    display: flex;
    justify-content: flex-start;
  }
  .auth-signed-in {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    background: #ECFDF5;
    color: var(--green);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: var(--font-display);
    font-weight: 600;
  }
  .invite-input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid var(--gray-200);
    border-radius: var(--radius-sm);
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-align: center;
    margin-bottom: 12px;
  }
  .invite-input:focus {
    outline: none;
    border-color: var(--pink-deep);
  }
  .invite-input::placeholder {
    color: var(--gray-400);
    font-weight: 400;
    letter-spacing: 0.02em;
  }
  .auth-hint {
    text-align: center;
    color: var(--gray-400);
    font-size: 12px;
    margin-top: 20px;
  }
  .auth-error {
    padding: 12px 16px;
    background: #FEF2F2;
    color: var(--red);
    border-radius: var(--radius-sm);
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .auth-error.show { display: block; }

  .empty-state { text-align: center; padding: 60px 24px; color: var(--gray-500); }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    padding: 12px 20px; background: var(--gray-800); color: var(--white);
    border-radius: var(--radius-md); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    font-size: 14px; font-weight: 600; display: none; z-index: 200;
  }

      inp.value = inp.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitAuth();
    });
  }

  let gsiReadyChecker = null;
  function initGoogleSignIn() {
    // Google GSI 可能還沒載入完，用輪詢等
    if (typeof google === 'undefined' || !google.accounts) {
      if (gsiReadyChecker) return;
      gsiReadyChecker = setInterval(() => {
        if (typeof google !== 'undefined' && google.accounts) {
          clearInterval(gsiReadyChecker);
          gsiReadyChecker = null;
          initGoogleSignIn();
        }
      }, 200);
      return;
    }
    if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.startsWith('REPLACE')) {
      showAuthError('Google 登入尚未設定 · 請聯絡主辦方');
      return;
    }
    try {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential,
        auto_select: false,
        use_fedcm_for_prompt: false
      });
      google.accounts.id.renderButton(
        document.getElementById('gsiButton'),
        { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', width: 300 }
      );
    } catch (e) {
      showAuthError('Google 登入初始化失敗：' + e.message);
    }
  }

  function handleGoogleCredential(response) {
    const idToken = response.credential;
    // Client-side decode 只是為了立刻顯示 email，實際驗證仍在後端做
    try {
      const payload = decodeJwtPayload_(idToken);
      session.idToken = idToken;
      session.email = payload.email;
      session.name = payload.name;
      $('#signedInEmail').textContent = payload.email;
      $('#signedInBanner').style.display = 'flex';
      document.getElementById('gsiButton').style.display = 'none';
      $('#step2').classList.add('done');
    } catch (e) {
      showAuthError('無法解析 Google 登入資訊：' + e.message);
    }

    $('#signedInBanner').style.display = 'none';
    $('#step2').classList.remove('done');
    document.getElementById('gsiButton').style.display = 'flex';

  function signOut() {
    session = { idToken: null, inviteCode: null, email: null, name: null };

      google.accounts.id.disableAutoSelect();
    }
    location.reload();
  }

    hideAuthError();

      const res = await api('judge-get-teams');

        showAuthError(res.message || '驗證失敗，請確認邀請碼是否正確');

        return;

      sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
      allTeams = res.teams || [];
      myScores = res.myScores || {};

      showAuthError('連線失敗：' + err.message);
      session.inviteCode = null;
    }

          </div>
        </div>
        <div class="progress-row">
          <div class="progress-stats">
            <div>
              <div class="progress-stat-label">已評 / 總數</div>
              <div class="progress-stat-value">${scoredCount} / ${totalCount}</div>
            </div>
            <div>
              <div class="progress-stat-label">進度</div>
              <div class="progress-stat-value">${totalCount ? Math.round(scoredCount/totalCount*100) : 0}%</div>
            </div>
          </div>
          <div class="filter-tabs">
            <button class="filter-tab ${currentFilter==='all'?'active':''}" data-filter="all">全部</button>
            <button class="filter-tab ${currentFilter==='pending'?'active':''}" data-filter="pending">未評</button>
            <button class="filter-tab ${currentFilter==='scored'?'active':''}" data-filter="scored">已評</button>
            <button class="filter-tab ${currentFilter==='1'?'active':''}" data-filter="1">校園</button>
            <button class="filter-tab ${currentFilter==='2'?'active':''}" data-filter="2">商業</button>
            <button class="filter-tab ${currentFilter==='3'?'active':''}" data-filter="3">創作</button>
            <button class="filter-tab ${currentFilter==='4'?'active':''}" data-filter="4">公益</button>
          </div>
        </div>
        <div class="team-list" id="teamList"></div>
      </div>
    `;
    renderTeamList();
    lucide.createIcons();
    $$('.filter-tab').forEach(b => b.addEventListener('click', () => {
      currentFilter = b.dataset.filter;
      renderApp(judge);
    }));
  }

  function renderTeamList() {
    const teams = allTeams.filter(t => {
      const scored = !!myScores[t.id];
      if (currentFilter === 'pending') return !scored;
      if (currentFilter === 'scored') return scored;
      if (['1','2','3','4'].includes(currentFilter)) return String(t.theme) === currentFilter;
      return true;
    });
    if (!teams.length) {
      $('#teamList').innerHTML = '<div class="empty-state">目前沒有符合條件的隊伍</div>';
      return;
    }
    $('#teamList').innerHTML = teams.map((t, i) => renderTeamCard(t, i)).join('');
    lucide.createIcons();
    $$('.team-header').forEach(h => h.addEventListener('click', () => {
      const card = h.closest('.team-card');
      card.classList.toggle('expanded');
      if (card.classList.contains('expanded')) mountBody(card);
    }));
  }

  function renderTeamCard(t, i) {
    const scored = !!myScores[t.id];
    return `
      <article class="team-card" data-team="${t.id}">
        <div class="team-header">
          <div class="team-header-left">
            <div class="team-idx">${String(i+1).padStart(2,'0')}</div>
            <div class="team-title-block">
              <div class="team-name">
                <span>${esc(t.name)}</span>
                <span class="team-theme-tag">${THEMES[t.theme] || '—'}</span>
              </div>
              <div class="team-title-sub">${esc(t.title || '')} · ${esc(t.school || '')}</div>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="team-status ${scored ? 'status-scored' : 'status-pending'}">
              ${scored ? `<i data-lucide="check-circle-2"></i><span>已評 ${sumScore(myScores[t.id])} 分</span>` : `<i data-lucide="clock"></i><span>待評</span>`}
            </div>
            <i data-lucide="chevron-down" class="expand-icon"></i>
          </div>
        </div>
      </article>
    `;
  }

  function sumScore(s) {
    if (!s) return 0;
    return (Number(s.d1)||0) + (Number(s.d2)||0) + (Number(s.d3)||0) + (Number(s.d4)||0) + (Number(s.d5)||0);
  }

  const RUNTIME_LABEL = {
    cloud: '雲端 Learning',
    local: '本地端 Docker',
    both:  '雲端 + 本地端'
  };

  function renderTeamMeta(t) {
    const teacherInfo = (t.teacherName || t.referralCode)
      ? esc(t.teacherName || '—') + (t.referralCode ? ` · <span style="font-family:monospace;color:var(--pink-deep);">${esc(t.referralCode)}</span>` : '')
      : '<span style="color:var(--gray-400);">未填 · 自主參賽</span>';

    const modeInfo = t.mode === 'remote'
      ? '<strong style="color:var(--pink-deep);">遠端連線</strong> · <a href="https://meet.google.com/sdx-abaj-jzp" target="_blank" rel="noopener">開啟 Google Meet</a>'
      : '現場出席';

    const basicGrid = [
      ['隊名', esc(t.name)],
      ['學校', esc(t.school)],
      ['隊長', esc(t.leader) + (t.memberCount ? ` · ${t.memberCount} 人團隊` : '')],
      ['題目', THEMES[t.theme]],
      ['作品標題', esc(t.title)],
      ['推薦老師', teacherInfo],
      ['參賽方式', modeInfo]
    ].map(([k, v]) => `<div class="team-meta-item"><div class="team-meta-label">${k}</div><div class="team-meta-value">${v || '—'}</div></div>`).join('');

    const summaryBlock = t.summary ? `
      <div class="team-block">
        <div class="team-block-title"><i data-lucide="file-text"></i> 作品簡介</div>
        <div style="font-size:13.5px; color:var(--gray-700); line-height:1.7;">${esc(t.summary)}</div>
      </div>
    ` : '';

    const membersBlock = (Array.isArray(t.members) && t.members.length) ? `
      <div class="team-block">
        <div class="team-block-title"><i data-lucide="users"></i> 隊員名單</div>
        <div class="members-list">
          ${t.members.map((m, i) => `
            <div class="member-chip">
              <span class="member-chip-num">${i + 1}</span>
              <div class="member-chip-body">
                <div class="member-chip-name">${esc(m.name || '(未填)')}</div>
                <div class="member-chip-meta">${esc([m.school, m.dept, m.year].filter(Boolean).join(' · ') || '—')}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    ` : '';

    const certsBlock = (Array.isArray(t.certs) && t.certs.length) ? `
      <div class="team-block">
        <div class="team-block-title"><i data-lucide="award"></i> Level 1 認證證照（${t.certs.length} 張）</div>
        <div class="certs-gallery">
          ${t.certs.map((c, i) => `
            <div class="cert-tile" onclick="openLightbox('${escAttr(c.url || '')}', '${escAttr(c.thumbUrl || '')}')">
              ${c.thumbUrl
                ? `<img src="${escAttr(c.thumbUrl)}" alt="${escAttr(c.name || 'cert')}" onerror="this.replaceWith(certFallback());">`
                : `<div class="cert-tile-fallback"><i data-lucide="image"></i><span>${esc(c.name || 'cert')}</span></div>`
              }
            </div>
          `).join('')}
        </div>
      </div>
    ` : '';

    const workflowsBlock = (Array.isArray(t.workflows) && t.workflows.length) ? `
      <div class="team-block">
        <div class="team-block-title"><i data-lucide="file-code-2"></i> Workflow JSON（${t.workflows.length} 檔）</div>
        <div class="file-btns">
          ${t.workflows.map(w => `
            <a class="file-btn" href="${escAttr(w.downloadUrl || w.url)}" target="_blank" rel="noopener">
              <i data-lucide="download"></i><span class="file-btn-name">${esc(w.name || 'workflow.json')}</span>
            </a>
          `).join('')}
        </div>
      </div>
    ` : '';

    const runtimeBlock = t.runtime ? `
      <div class="team-block">
        <div class="team-block-title"><i data-lucide="server"></i> 運行環境</div>
        <div class="runtime-badge">${RUNTIME_LABEL[t.runtime] || t.runtime}</div>
        <div class="runtime-detail">
          ${t.cloudUrl ? `<a href="${escAttr(t.cloudUrl)}" target="_blank" rel="noopener"><i data-lucide="external-link"></i>開雲端 Workflow</a>` : ''}
          ${t.localDeps ? `<div class="runtime-local-deps">${esc(t.localDeps)}</div>` : ''}
        </div>
      </div>
    ` : '';

    const linksGrid = [
      ['Demo 影片', t.video ? `<a href="${escAttr(t.video)}" target="_blank" rel="noopener">開啟 →</a>` : '—'],
      ['Pitch 簡報', t.pitch ? `<a href="${escAttr(t.pitch)}" target="_blank" rel="noopener">開啟 →</a>` : '—']
    ].map(([k, v]) => `<div class="team-meta-item"><div class="team-meta-label">${k}</div><div class="team-meta-value">${v}</div></div>`).join('');

    return `
      <div class="team-meta-grid">${basicGrid}</div>
      ${summaryBlock}
      ${membersBlock}
      ${certsBlock}
      ${workflowsBlock}
      ${runtimeBlock}
      <div class="team-meta-grid">${linksGrid}</div>
    `;
  }

  window.copyLearningCred = function(id, btn) {
    const el = document.getElementById(id);
    if (!el) return;
    const text = el.textContent.trim();
    const done = () => {
      const orig = btn.textContent;
      btn.textContent = '已複製';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => {});
    } else {
      const t = document.createElement('textarea');
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(t);
    }
  };

  window.openLightbox = function(url, thumbUrl) {
    const lb = document.getElementById('lightbox');
    if (!lb) return;
    lb.querySelector('img').src = url || thumbUrl;
    lb.classList.add('show');
  };
  window.closeLightbox = function() {
    document.getElementById('lightbox')?.classList.remove('show');
  };
  window.certFallback = function() {
    const div = document.createElement('div');
    div.className = 'cert-tile-fallback';
    div.innerHTML = '<i data-lucide="image-off"></i><span>載入失敗</span>';
    setTimeout(() => lucide.createIcons(), 10);
    return div;
  };

  function mountBody(card) {
    if (card.querySelector('.team-body')) return;
    const teamId = card.dataset.team;
    const t = allTeams.find(x => x.id === teamId);
    const prev = myScores[teamId] || {};
    const tpl = document.getElementById('tpl-team-body');
    card.appendChild(tpl.content.cloneNode(true));

    const metaEl = card.querySelector('.team-meta');
    metaEl.innerHTML = renderTeamMeta(t);

    ['d1','d2','d3','d4','d5'].forEach(dim => {
      const val = Number(prev[dim] || 0);
      card.querySelector(`.score-slider[data-dim="${dim}"]`).value = val;
      card.querySelector(`.score-value-input[data-dim="${dim}"]`).value = val;
    });
    updateTotal(card);

    card.querySelectorAll('.score-slider').forEach(sl => {
      sl.addEventListener('input', () => {
        card.querySelector(`.score-value-input[data-dim="${sl.dataset.dim}"]`).value = sl.value;
        updateTotal(card);
      });
    });
    card.querySelectorAll('.score-value-input').forEach(inp => {
      inp.addEventListener('input', () => {
        const max = Number(inp.max);
        let v = Math.max(0, Math.min(max, Number(inp.value) || 0));
        inp.value = v;
        card.querySelector(`.score-slider[data-dim="${inp.dataset.dim}"]`).value = v;
        updateTotal(card);
      });
    });

    if (prev.note) card.querySelector('.note-textarea').value = prev.note;

    card.querySelector('.btn-clear').addEventListener('click', () => {
      if (!confirm('確定清空此隊伍所有分數？')) return;
      card.querySelectorAll('.score-slider').forEach(s => s.value = 0);
      card.querySelectorAll('.score-value-input').forEach(i => i.value = 0);
      card.querySelector('.note-textarea').value = '';
      updateTotal(card);
    });
    card.querySelector('.btn-submit').addEventListener('click', () => submitScore(card));
    lucide.createIcons();
  }

  function updateTotal(card) {
    let total = 0;
    ['d1','d2','d3','d4','d5'].forEach(dim => {
      total += Number(card.querySelector(`.score-value-input[data-dim="${dim}"]`).value) || 0;
    });
    card.querySelector('.total-num').textContent = total;
  }

  async function submitScore(card) {
    const teamId = card.dataset.team;
    const scores = {};
    ['d1','d2','d3','d4','d5'].forEach(dim => {
      scores[dim] = Number(card.querySelector(`.score-value-input[data-dim="${dim}"]`).value) || 0;
    });
    const note = card.querySelector('.note-textarea').value.trim();
    const btn = card.querySelector('.btn-submit');
    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader-circle" style="animation:spin 1s linear infinite;"></i><span>送出中⋯</span>';
    lucide.createIcons();
    try {
      const res = await api('judge-submit-score', { teamId, scores, note });
      if (res.ok) {
        myScores[teamId] = { ...scores, note, ts: new Date().toISOString() };
        toast('已送出評分', 'success');
        card.classList.remove('expanded');
        card.querySelector('.team-body')?.remove();
        renderApp(res.judge || { name: session.name, email: session.email });
      } else {
        toast('送出失敗：' + (res.message || '未知錯誤'), 'error');
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="check"></i><span>送出評分</span>';
        lucide.createIcons();
      }
    } catch (err) {
      toast('連線錯誤：' + err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="check"></i><span>送出評分</span>';
      lucide.createIcons();
    }
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escAttr(s) { return esc(s); }

  // 修正 JWT payload 中文亂碼：先 base64→bytes，再用 TextDecoder 以 UTF-8 解
  function decodeJwtPayload_(jwt) {
    const b64 = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
    const bin = atob(padded);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const jsonStr = new TextDecoder('utf-8').decode(bytes);
    return JSON.parse(jsonStr);
  }

  /* Language Toggle */
  (function () {
    const STORAGE_KEY = 'site-lang';
    const btn = document.getElementById('langBtn');
    if (!btn) return;
    function applyLang(lang) {
      document.documentElement.lang = (lang === 'en') ? 'en' : 'zh-Hant';
      document.querySelectorAll('[data-en]').forEach(function (el) {
        if (el.dataset.zh === undefined) el.dataset.zh = el.innerHTML;
        el.innerHTML = (lang === 'en') ? el.dataset.en : el.dataset.zh;
      });
      btn.textContent = (lang === 'en') ? '中文' : 'EN';
      try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) {}
      if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
    }
    btn.addEventListener('click', function () {
      const current = (document.documentElement.lang === 'en') ? 'en' : 'zh';
      applyLang(current === 'en' ? 'zh' : 'en');
    });
    try { if (localStorage.getItem(STORAGE_KEY) === 'en') applyLang('en'); } catch (e) {}
    // 頁面動態渲染後再套一次
    const app = document.getElementById('app');
    if (app) {
      new MutationObserver(function () {
        const cur = (document.documentElement.lang === 'en') ? 'en' : 'zh';
        if (cur === 'en') applyLang('en');
      }).observe(app, { childList: true });
    }
  })();
</script>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img src="" alt="Certificate">
</div>

</body>
</html>
