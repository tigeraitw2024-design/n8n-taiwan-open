<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>參賽證明書 · n8n Taiwan Open Hackathon 2026</title>
<meta name="description" content="n8n Taiwan Open Hackathon 2026 · 官方參賽證明書 · 可掃 QR code 或點連結線上驗證真偽">
<meta property="og:title" content="n8n Taiwan Open Hackathon 2026 · 參賽證明書">
<meta property="og:description" content="首屆 n8n 台灣官方黑客松參賽證明 · 由 AI 評審團實機驗證作品 · 官方發放、可線上驗真">
<meta property="og:type" content="article">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- 不外掛 Google Fonts · 完全用系統原生字型 · 每台電腦都渲染一致 · 沒有 CDN 依賴 -->
<script src="https://unpkg.com/lucide@latest" onerror="window.lucideFailed=true"></script>
<style>
  :root {
    --pink: #F0648C;
    --pink-deep: #EA4B71;
    --gold: #C9A961;
    --gold-deep: #A88540;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --ink-light: #7a7a7a;
    --paper: #FFFFFF;
    --paper-soft: #FAFAF7;
    --line: #E8E2D0;
    /* 全站字型統一 · 完全走系統原生 · 沒有 Google Fonts 依賴
       英文自動用 Mac 的 SF Pro / Windows 的 Segoe UI(靠 system-ui/-apple-system 觸發)
       中文自動用 Mac 的 PingFang TC / Windows 的 Microsoft JhengHei
       只有大標題 --font-title 走中文 serif · Mac 是 Songti / Windows 是 PMingLiU */
    --font-body: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial,
                 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
    --font-title: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial,
                  'Songti TC', 'PMingLiU', 'MingLiU', 'Noto Serif TC', serif;
    --font-en: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
    /* 固定直式證書尺寸 · A4 直式 210x297mm @ ~3.78px/mm 對應 794x1123 · 加點內距 */
    --cert-w: 800px;
    --cert-h: 1131px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: var(--font-body); }
  body {
    background: #ECEBE6;
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding: 24px 20px;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  /* ============ TOP BAR ============ */
  .topbar {
    max-width: var(--cert-w);
    margin: 0 auto 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 8px;
  }
  .topbar a { color: var(--ink-soft); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .topbar a:hover { color: var(--pink-deep); }
  .topbar svg { width: 14px; height: 14px; }

  /* ============ CERT WRAP · 完全固定尺寸 · 版型不隨螢幕變 ============ */
  .cert-wrap {
    /* 小螢幕產生水平捲軸 · 證書維持原尺寸 · 保證每人看到的一模一樣 */
    overflow-x: auto;
    overflow-y: hidden;
    padding: 0;
    -webkit-overflow-scrolling: touch;
  }
  .cert-scaler {
    width: var(--cert-w);
    height: var(--cert-h);
    margin: 0 auto;
  }
  .cert {
    width: var(--cert-w);
    height: var(--cert-h);
    background: var(--paper);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
    position: relative;
    overflow: hidden;
  }
  .cert::before {
    content: '';
    position: absolute;
    top: 18px; left: 18px; right: 18px; bottom: 18px;
    border: 2px solid var(--gold);
    pointer-events: none;
  }
  .cert::after {
    content: '';
    position: absolute;
    top: 24px; left: 24px; right: 24px; bottom: 24px;
    border: 1px solid var(--gold);
    pointer-events: none;
  }
  .cert-inner {
    position: relative;
    padding: 48px 56px 32px;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ============ HEADER ============ */
  .cert-header {
    text-align: center;
  }
  .cert-brand {
    font-family: var(--font-body);
    font-weight: 900;
    font-size: 15px;
    color: var(--pink-deep);
    margin-bottom: 4px;
  }
  .cert-brand-cn {
    font-family: var(--font-cn);
    font-size: 12px;
    color: var(--ink-light);
    margin-bottom: 22px;
  }
  .cert-title-en {
    font-family: var(--font-en);
    font-size: 13px;
    color: var(--gold-deep);
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .cert-title {
    font-family: var(--font-title);
    font-size: 38px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.15;
    letter-spacing: 0.08em;
  }
  .cert-title-mark {
    display: block;
    margin-top: 10px;
    color: var(--gold);
    font-size: 14px;
    letter-spacing: 0.5em;
  }

  /* ============ RECIPIENT ============ */
  .cert-recipient {
    text-align: center;
    padding: 6px 0 8px;
  }
  .cert-tzh {
    font-family: var(--font-title);
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 12px;
    letter-spacing: 0.4em;
    padding-left: 0.4em;
  }
  .cert-name-wrap {
    display: inline-block;
    padding: 12px 60px 10px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    min-width: 380px;
  }
  .cert-name {
    font-family: var(--font-title);
    font-size: 40px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.15em;
    padding-left: 0.15em;
    display: inline-block;
  }
  .cert-role-badge {
    display: inline-block;
    margin-left: 10px;
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 700;
    background: var(--pink);
    color: #fff;
    vertical-align: 10px;
    letter-spacing: 0.05em;
    font-family: var(--font-body);
  }
  .cert-school {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink-light);
    margin-top: 12px;
    letter-spacing: 0.05em;
  }

  /* ============ STATEMENT + FACTS · portrait 堆疊 ============ */
  .cert-statement {
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.95;
    color: var(--ink);
    text-align: justify;
    padding: 0 12px;
  }
  .cert-statement strong { font-weight: 900; color: var(--pink-deep); }

  .cert-facts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 32px;
    padding: 14px 20px;
    background: var(--paper-soft);
    border-left: 3px solid var(--gold);
  }
  .cert-fact { display: flex; flex-direction: column; gap: 3px; }
  .cert-fact-label {
    font-family: var(--font-en);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--ink-light);
    font-weight: 700;
  }
  .cert-fact-value {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
    font-weight: 700;
  }
  .cert-fact-value.mono {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--gold-deep);
  }

  /* ============ WITNESSES ============ */
  .cert-witnesses {
    border-top: 1px solid var(--gold);
    border-bottom: 1px solid var(--gold);
    padding: 10px 16px;
    background: linear-gradient(180deg, transparent 0%, rgba(201, 169, 97, 0.04) 100%);
  }
  .cert-witnesses-label {
    text-align: center;
    font-family: var(--font-en);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--gold-deep);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .cert-witnesses-list {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .cert-witness { text-align: center; }
  .cert-witness-name {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    line-height: 1.25;
    margin-bottom: 3px;
  }
  .cert-witness-role {
    font-family: var(--font-body);
    font-size: 9.5px;
    color: var(--ink-light);
    line-height: 1.4;
    white-space: nowrap;
    text-wrap: pretty;   /* 現代瀏覽器 · 若真的太窄要換行 · 也不留孤字 */
  }

  /* ============ SIGNATURES + QR ============ */
  .cert-sigs {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 24px;
    align-items: flex-end;
    padding: 4px 8px 0;
  }
  .cert-sig { text-align: center; }
  .cert-sig-image {
    height: 56px;
    max-width: 220px;
    margin: 0 auto 6px;
    object-fit: contain;
    display: block;
  }
  .cert-sig-image.tigerai-logo { height: 48px; max-width: 200px; }
  .cert-sig-line {
    height: 1.5px;
    background: var(--ink);
    max-width: 220px;
    margin: 0 auto 8px;
  }
  .cert-sig-role {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--ink-light);
    line-height: 1.55;
  }
  .cert-sig-role strong { color: var(--ink); font-weight: 700; font-size: 12px; }

  .cert-verify {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .cert-qr {
    background: #fff;
    padding: 3px;
    border: 1px solid var(--line);
  }
  .cert-qr img { width: 82px; height: 82px; display: block; }
  .cert-qr-label {
    font-family: var(--font-en);
    font-size: 9px;
    color: var(--ink-light);
    letter-spacing: 0.1em;
    font-weight: 600;
  }

  /* ============ FOOTER STRIP · 序號 + 贊助 ============ */
  .cert-footstrip {
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .cert-meta {
    font-family: var(--font-body);
    font-size: 10px;
    color: var(--ink-light);
    line-height: 1.7;
    text-align: center;
  }
  .cert-meta strong { color: var(--ink-soft); font-weight: 700; }
  .cert-meta code {
    font-family: var(--font-mono);
    background: var(--paper-soft);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--gold-deep);
    font-size: 10px;
  }
  .cert-sponsors {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
  }
  .cert-sponsors img {
    height: 24px;
    max-width: 90px;
    object-fit: contain;
    filter: grayscale(1) contrast(1.05);
    opacity: 0.72;
  }

  /* ============ ACTIONS BAR ============ */
  .actions {
    max-width: var(--cert-w);
    margin: 20px auto 0;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 11px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    font-family: var(--font-body);
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s ease;
    color: var(--ink);
  }
  .btn svg { width: 14px; height: 14px; }
  .btn-primary { background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%); color: #fff; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(240,100,140,0.35); }
  .btn-ghost { background: #fff; border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--paper-soft); border-color: var(--gold); }

  .resume-blurb {
    max-width: var(--cert-w);
    margin: 24px auto 0;
    padding: 20px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .resume-blurb h3 {
    font-family: var(--font-body);
    font-size: 14px;
    margin-bottom: 10px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .resume-blurb h3 svg { width: 15px; height: 15px; color: var(--pink); }
  .resume-blurb-body {
    background: var(--paper-soft);
    padding: 14px;
    border-radius: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.85;
    color: var(--ink);
    white-space: pre-wrap;
  }
  .resume-blurb-hint {
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--ink-light);
    margin-top: 8px;
  }

  /* ============ STATES ============ */
  .loading, .error {
    max-width: 560px;
    margin: 80px auto;
    padding: 60px 40px;
    background: #fff;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
  }
  .loading svg { width: 40px; height: 40px; color: var(--pink); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error svg { width: 48px; height: 48px; color: #d94a4a; margin-bottom: 12px; }
  .error h2 { font-family: var(--font-body); font-size: 22px; color: var(--ink); margin-bottom: 8px; }
  .error p { color: var(--ink-light); font-size: 14px; margin-bottom: 20px; }
  .error code { font-family: var(--font-mono); background: var(--paper-soft); padding: 2px 8px; border-radius: 4px; }

  /* ============ PRINT · 用固定 px 頁面尺寸 · 瀏覽器等比縮到 A4 · 不切頁不變形 ============ */
  @page {
    /* 頁面尺寸就是證書設計尺寸 · 瀏覽器會等比縮到你選的紙(A4)· 一頁完整印出 */
    size: 800px 1131px;
    margin: 0;
  }
  @media print {
    html, body {
      background: #fff !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    .topbar, .actions, .resume-blurb { display: none !important; }
    .cert-wrap {
      overflow: visible !important;
      padding: 0 !important;
      margin: 0 !important;
      max-width: none !important;
    }
    .cert-scaler, .cert {
      box-shadow: none !important;
      margin: 0 !important;
      page-break-after: avoid !important;
      page-break-inside: avoid !important;
    }
    .cert::before, .cert::after {
      /* 列印時金邊往內縮 · 避免被印表機邊界切掉 */
      top: 12px !important; left: 12px !important; right: 12px !important; bottom: 12px !important;
    }
  }
</style>
</head>
<body>

<nav class="topbar" id="topbar">
  <a href="index.html"><i data-lucide="chevron-left"></i><span>回活動首頁</span></a>
  <a href="ai-review.html"><span>看 AI 評審團報告</span><i data-lucide="arrow-right"></i></a>
</nav>

<main id="app">
  <div class="loading">
    <i data-lucide="loader-2"></i>
    <p style="margin-top:16px; color:var(--ink-light); font-size:14px;">正在讀取證書資料…</p>
  </div>
</main>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxgSAroD9N2Bs3-kKj5WV2oyFuMpznthbyujiRa3Q9SV3qH2PfdwgP2mx3wEMFLjgj7TQ/exec';
const TEAM_STATS = {
  T001: { workflows: 3, nodes: 52 },  T002: { workflows: 2, nodes: 75 },
  T003: { workflows: 5, nodes: 29 },  T004: { workflows: 1, nodes: 23 },
  T005: { workflows: 1, nodes: 3 },   T006: { workflows: 3, nodes: 100 },
  T007: { workflows: 2, nodes: 48 },  T008: { workflows: 4, nodes: 50 },
  T009: { workflows: 1, nodes: 20 },  T010: { workflows: 5, nodes: 158 },
  T011: { workflows: 1, nodes: 13 },  T012: { workflows: 2, nodes: 15 },
  T013: { workflows: 1, nodes: 28 },  T014: { workflows: 2, nodes: 12 }
};
const MODE_LABEL = { onsite: '現場出席', remote: '遠端連線' };

function getParam(name) {
  return new URLSearchParams(location.search).get(name) || '';
}
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderError(msg, certId) {
  document.getElementById('app').innerHTML = `
    <div class="error">
      <i data-lucide="x-circle"></i>
      <h2>找不到此證書</h2>
      <p>${esc(msg)}</p>
      ${certId ? `<p>查詢的證書 ID: <code>${esc(certId)}</code></p>` : ''}
      <a href="index.html" class="btn btn-primary" style="margin-top:8px; text-decoration:none;">
        <i data-lucide="home"></i><span>回活動首頁</span>
      </a>
    </div>
  `;
  if (window.lucide) lucide.createIcons();
}

function renderCert(cert) {
  const stats = TEAM_STATS[cert.teamId] || { workflows: '—', nodes: '—' };
  const modeLabel = MODE_LABEL[cert.mode] || '現場出席';
  const certUrl = location.origin + location.pathname + '?id=' + cert.id;
  const aiReviewUrl = location.origin + '/ai-review.html';
  const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=' + encodeURIComponent(certUrl);
  const qrFallback = 'https://chart.googleapis.com/chart?cht=qr&chs=200x200&chld=M|0&chl=' + encodeURIComponent(certUrl);

  document.title = `${cert.recipientName} · 參賽證明書 · n8n Taiwan Open 2026`;

  document.getElementById('app').innerHTML = `
    <div class="cert-wrap">
      <div class="cert-scaler" id="certScaler">
        <article class="cert">
          <div class="cert-inner">

            <header class="cert-header">
              <div class="cert-brand">n8n · TAIWAN OPEN HACKATHON</div>
              <div class="cert-brand-cn">2026 首屆 · 全台大專院校 n8n 自動化黑客松</div>
              <div class="cert-title-en">CERTIFICATE OF PARTICIPATION</div>
              <h1 class="cert-title">決賽參賽證明書</h1>
              <span class="cert-title-mark">◆ ◆ ◆</span>
            </header>

            <section class="cert-recipient">
              <div class="cert-tzh">茲 證 明</div>
              <div class="cert-name-wrap">
                <span class="cert-name">${esc(cert.recipientName)}</span>
                ${cert.isLeader ? '<span class="cert-role-badge">隊長</span>' : ''}
              </div>
              ${cert.school ? `<div class="cert-school">${esc(cert.school)}</div>` : ''}
            </section>

            <p class="cert-statement">
              於 <strong>2026 年 8 月 7 日</strong> · 於 <strong>t.Hub Taipei 內科創新育成基地</strong> ·
              參與 n8n Taiwan Open Hackathon 2026 首屆決賽 ·
              所屬「<strong>${esc(cert.teamName)}</strong>」以《${esc(cert.workTitle)}》為題 ·
              於 4.5 小時內完成 <strong>${stats.workflows}</strong> 支 workflow · 共 <strong>${stats.nodes}</strong> 個節點的 AI 自動化作品 ·
              並通過主辦方 <strong>AI 評審團(Claude · Codex · Gemini)</strong>
              四步驗證 · <strong>100% 實機驗證通過</strong> · 特此證明。
            </p>

            <div class="cert-facts">
              <div class="cert-fact">
                <div class="cert-fact-label">題目類別 · CATEGORY</div>
                <div class="cert-fact-value">${esc(cert.themeLabel)}</div>
              </div>
              <div class="cert-fact">
                <div class="cert-fact-label">參賽方式 · MODE</div>
                <div class="cert-fact-value">${esc(modeLabel)}</div>
              </div>
              <div class="cert-fact">
                <div class="cert-fact-label">隊伍規模 · TEAM SIZE</div>
                <div class="cert-fact-value">${cert.memberCount} 人</div>
              </div>
              <div class="cert-fact">
                <div class="cert-fact-label">隊伍代號 · TEAM ID</div>
                <div class="cert-fact-value mono">${esc(cert.teamId)}</div>
              </div>
            </div>

            <section class="cert-witnesses">
              <div class="cert-witnesses-label">業界評審共同見證 · CO-WITNESSED BY THE JUDGING PANEL</div>
              <div class="cert-witnesses-list">
                <div class="cert-witness">
                  <div class="cert-witness-name">欒斌 教授</div>
                  <div class="cert-witness-role">臺科大企管系 · 教育部師鐸獎</div>
                </div>
                <div class="cert-witness">
                  <div class="cert-witness-name">游文賢 理事長</div>
                  <div class="cert-witness-role">中華亞太智慧物聯發展協會</div>
                </div>
                <div class="cert-witness">
                  <div class="cert-witness-name">陳鵬如</div>
                  <div class="cert-witness-role">撼訊集團 總經理特助</div>
                </div>
                <div class="cert-witness">
                  <div class="cert-witness-name">林穎彥</div>
                  <div class="cert-witness-role">AMD 軟體開發工程師</div>
                </div>
                <div class="cert-witness">
                  <div class="cert-witness-name">林毓晟</div>
                  <div class="cert-witness-role">晟景科技</div>
                </div>
              </div>
            </section>

            <section class="cert-sigs">
              <div class="cert-sig">
                <img class="cert-sig-image" src="assets/signatures/morris.jpg" alt="Morris 盧業興 簽名">
                <div class="cert-sig-line"></div>
                <div class="cert-sig-role">
                  <strong>Morris 盧業興</strong><br>
                  n8n 台灣首位官方 Ambassador · TigerAI 執行長
                </div>
              </div>
              <div class="cert-sig">
                <img class="cert-sig-image tigerai-logo" src="assets/logos/tigerai.png" alt="TigerAI">
                <div class="cert-sig-line"></div>
                <div class="cert-sig-role">
                  <strong>虎智科技股份有限公司</strong><br>
                  n8n Taiwan Open Hackathon 主辦單位 · 統一編號 93489997
                </div>
              </div>
              <div class="cert-verify">
                <div class="cert-qr">
                  <img id="qrImg" alt="Verify QR" width="82" height="82"
                       src="${qrSrc}"
                       onerror="this.onerror=null;this.src='${qrFallback}'">
                </div>
                <div class="cert-qr-label">SCAN TO VERIFY</div>
              </div>
            </section>

            <section class="cert-footstrip">
              <div class="cert-meta">
                <strong>證書序號</strong> · <code>${esc(cert.id)}</code> ·
                <strong>頒發日期</strong> · 2026 年 8 月 8 日 ·
                <strong>線上驗證</strong> · ${esc(certUrl)}
              </div>
              <div class="cert-sponsors">
                <img src="assets/logos/drmaster.png" alt="博碩文化">
                <img src="assets/logos/ntust-incubator.png" alt="臺科大創新育成中心">
                <img src="assets/logos/n8n.svg" alt="n8n">
                <img src="assets/logos/amd.png" alt="AMD">
                <img src="assets/logos/tul.png" alt="TUL">
                <img src="assets/logos/zeabur.svg" alt="Zeabur">
                <img src="assets/logos/aiot-association.jpg" alt="中華亞太智慧物聯發展協會">
                <img src="assets/logos/t-hub-taipei.png" alt="t.Hub Taipei">
              </div>
            </section>

          </div>
        </article>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-primary" onclick="window.print()">
        <i data-lucide="printer"></i><span>列印 / 存 PDF · A4 直式</span>
      </button>
      <button type="button" class="btn btn-ghost" onclick="copyLink()">
        <i data-lucide="link"></i><span>複製證書連結</span>
      </button>
      <a class="btn btn-ghost" href="${aiReviewUrl}#${cert.teamId}" target="_blank" rel="noopener">
        <i data-lucide="cpu"></i><span>看本隊 AI 評審評論</span>
      </a>
      <a class="btn btn-ghost" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(certUrl)}" target="_blank" rel="noopener">
        <i data-lucide="linkedin"></i><span>分享到 LinkedIn</span>
      </a>
    </div>

    <div class="resume-blurb">
      <h3><i data-lucide="clipboard-copy"></i>履歷可直接複製這段</h3>
      <div class="resume-blurb-body">2026 · n8n Taiwan Open Hackathon 決賽入圍(全台首屆 n8n 官方黑客松)
· 4.5 小時內以團隊完成 ${stats.workflows} 支 workflow · ${stats.nodes} 個節點的 AI 自動化作品《${cert.workTitle}》
· 作品通過主辦方 AI 評審團(Claude / Codex / Gemini)四步驗證 · n8n 官方 REST API 100% 實機匯入通過
· 官方參賽證明:${certUrl}
· 完整技術評論:${aiReviewUrl}#${cert.teamId}</div>
      <div class="resume-blurb-hint">建議放在履歷「競賽經歷」段落 · 讓 HR 掃 QR 或點連結即可驗真</div>
    </div>
  `;

  if (window.lucide) lucide.createIcons();
}

window.copyLink = async function() {
  const url = location.href;
  try {
    await navigator.clipboard.writeText(url);
    alert('證書連結已複製 · 貼到 LinkedIn / 履歷 / email 都可以');
  } catch (e) {
    prompt('請複製這個網址', url);
  }
};

const certId = getParam('id');
if (!certId) {
  renderError('網址缺少 id 參數 · 應為 cert.html?id=2026-NTO-T00X-YY');
} else {
  fetch(GAS_URL + '?action=cert-lookup&id=' + encodeURIComponent(certId))
    .then(r => r.json())
    .then(data => {
      if (data && data.ok && data.cert) {
        try { renderCert(data.cert); }
        catch (e) { console.error('render failed', e); renderError('證書顯示異常 · ' + e.message, certId); }
      } else {
        renderError(data && data.message ? data.message : '無法讀取證書資料', certId);
      }
    })
    .catch(err => {
      console.error('cert lookup failed', err);
      renderError('連線暫時有問題 · 請稍後再試 · ' + err.message, certId);
    });
}

if (window.lucide) lucide.createIcons();
</script>

</body>
</html>
