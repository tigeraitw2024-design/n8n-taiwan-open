<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>決賽作品上傳 · n8n Taiwan Open Hackathon 2026</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --pink: #F0648C;
    --pink-deep: #EA4B71;
    --pink-soft: #FFF5F5;
    --pink-bg: #FFECF2;
    --black: #0D0D0D;
    --white: #FFFFFF;
    --gray-50: #F9FAFB;
    --gray-100: #F3F4F6;
    --gray-200: #E5E7EB;
    --gray-300: #D1D5DB;
    --gray-400: #9CA3AF;
    --gray-500: #6B7280;
    --gray-600: #4B5563;
    --gray-700: #374151;
    --gray-800: #1F2937;
    --green: #10B981;
    --amber: #F59E0B;
    --red: #EF4444;
    --font-display: 'Satoshi', 'Noto Sans TC', -apple-system, system-ui, sans-serif;
    --font-body: 'Noto Sans TC', 'Satoshi', -apple-system, system-ui, sans-serif;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--gray-50);
    color: var(--gray-800);
    line-height: 1.6;
    min-height: 100vh;
  }
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--gray-200);
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--gray-800);
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .brand:hover { opacity: 0.75; }
  .brand-logo-mark {
    font-size: 22px;
    font-weight: 900;
    color: var(--pink-deep);
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .brand-logo-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-600);
  }
  .brand-divider {
    width: 1px;
    height: 20px;
    background: var(--gray-200);
    margin: 0 2px;
  }
  .brand-pill {
    padding: 4px 10px;
    border-radius: 100px;
    background: var(--pink-bg);
    color: var(--pink-deep);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .signed-info {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--gray-600);
  }
  .signed-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    color: var(--white);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
  }
  .btn-tiny {
    background: transparent;
    border: 1px solid var(--gray-300);
    color: var(--gray-600);
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 11px;
    cursor: pointer;
    font-family: var(--font-display);
    font-weight: 600;
  }
  .btn-tiny:hover { background: var(--gray-100); }
  .lang-btn {
    padding: 6px 14px;
    border-radius: 100px;
    border: 1px solid var(--gray-300);
    background: var(--white);
    color: var(--gray-700);
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .lang-btn:hover { border-color: var(--pink-deep); color: var(--pink-deep); }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }
  .page-title {
    font-family: var(--font-display);
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 900;
    color: var(--gray-800);
    line-height: 1.15;
    margin-bottom: 12px;
  }
  .page-title span {
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .page-sub {
    color: var(--gray-500);
    font-size: 15px;
    margin-bottom: 32px;
  }

  .banner {
    display: flex;
    gap: 12px;
    padding: 14px 18px;
    border-radius: var(--radius-md);
    background: var(--pink-soft);
    color: var(--gray-800);
    font-size: 14px;
    margin-bottom: 24px;
    align-items: flex-start;
  }
  .banner svg { flex-shrink: 0; width: 18px; height: 18px; color: var(--pink-deep); margin-top: 2px; }
  .banner strong { font-family: var(--font-display); }

  .section {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-xl);
    padding: 32px;
    margin-bottom: 20px;
  }
  .section-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--gray-100);
  }
  .section-num {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--pink-bg);
    color: var(--pink-deep);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 16px;
  }
  .section-title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    color: var(--gray-800);
    line-height: 1.2;
  }
  .section-desc {
    font-size: 13px;
    color: var(--gray-500);
    margin-top: 2px;
  }

  .row {
    display: grid;
    gap: 20px;
    margin-bottom: 20px;
  }
  .row-2 { grid-template-columns: 1fr 1fr; }
  .row-3 { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 640px) {
    .row-2, .row-3 { grid-template-columns: 1fr; }
    .section { padding: 24px 20px; }
    .container { padding: 24px 16px 100px; }
  }

  .label {
    display: block;
    font-family: var(--font-display);
    font-weight: 600;
    color: var(--gray-800);
    font-size: 14px;
    margin-bottom: 8px;
  }
  .label .req { color: var(--pink-deep); }
  .hint {
    font-size: 12.5px;
    color: var(--gray-500);
    margin-top: 6px;
    line-height: 1.5;
  }
  .input, .select, .textarea {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid var(--gray-200);
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--gray-800);
    background: var(--white);
    transition: border-color 0.15s;
  }
  .input:focus, .select:focus, .textarea:focus {
    outline: none;
    border-color: var(--pink-deep);
  }
  .textarea { resize: vertical; min-height: 100px; line-height: 1.6; }

  /* Radio card */
  .radio-group { display: flex; gap: 12px; flex-wrap: wrap; }
  .radio-card {
    flex: 1;
    min-width: 200px;
    padding: 16px 20px;
    border: 2px solid var(--gray-200);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .radio-card:hover { border-color: var(--pink); }
  .radio-card input { margin-top: 2px; accent-color: var(--pink-deep); }
  .radio-card.active {
    border-color: var(--pink-deep);
    background: var(--pink-soft);
  }
  .radio-card-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: var(--gray-800);
  }
  .radio-card-desc {
    font-size: 12.5px;
    color: var(--gray-500);
    margin-top: 4px;
    line-height: 1.5;
  }

  /* Member list */
  .member-item {
    padding: 20px;
    border: 2px dashed var(--gray-200);
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    position: relative;
  }
  .member-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .member-num {
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--pink-deep);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .btn-remove-member {
    background: transparent;
    border: none;
    color: var(--gray-400);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-display);
    font-weight: 600;
  }
  .btn-remove-member:hover { background: #FEF2F2; color: var(--red); }
  .btn-remove-member svg { width: 12px; height: 12px; }

  .btn-add {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    border: 2px dashed var(--gray-300);
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--gray-600);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    width: 100%;
    justify-content: center;
    transition: all 0.15s;
  }
  .btn-add:hover {
    border-color: var(--pink-deep);
    color: var(--pink-deep);
    background: var(--pink-soft);
  }
  .btn-add svg { width: 14px; height: 14px; }
  .btn-add[disabled] { opacity: 0.4; cursor: not-allowed; }

  /* File uploader */
  .upload-zone {
    display: block;
    width: 100%;
    border: 2px dashed var(--gray-300);
    border-radius: var(--radius-md);
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--gray-50);
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--pink-deep);
    background: var(--pink-soft);
  }
  .upload-zone-icon {
    display: block;
    width: 40px;
    height: 40px;
    margin: 0 auto 12px;
    color: var(--gray-400);
  }
  .upload-zone-title {
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--gray-800);
    font-size: 14px;
  }
  .upload-zone-desc {
    font-size: 12.5px;
    color: var(--gray-500);
    margin-top: 6px;
  }

  .file-list {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--gray-100);
    border-radius: var(--radius-sm);
    font-size: 13px;
  }
  .file-item svg { width: 14px; height: 14px; color: var(--pink-deep); }
  .file-item-name {
    color: var(--gray-700);
    font-family: var(--font-display);
    font-weight: 600;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-item-size { color: var(--gray-500); font-size: 12px; }
  .file-item-remove {
    background: transparent;
    border: none;
    color: var(--gray-400);
    cursor: pointer;
    padding: 4px;
    display: inline-flex;
  }
  .file-item-remove:hover { color: var(--red); }
  .file-item-remove svg { width: 12px; height: 12px; }

  /* Thumbnails for certs */
  .cert-thumb {
    width: 90px;
    height: 90px;
    border-radius: var(--radius-sm);
    object-fit: cover;
    border: 1px solid var(--gray-200);
  }
  .cert-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 12px;
    margin-top: 14px;
  }
  .cert-tile {
    position: relative;
  }
  .cert-tile .file-item-remove {
    position: absolute;
    top: 4px;
    right: 4px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 50%;
    padding: 4px;
  }
  .cert-tile-name {
    font-size: 11px;
    color: var(--gray-500);
    text-align: center;
    margin-top: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Checkbox */
  .check-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 16px;
    background: var(--gray-50);
    border-radius: var(--radius-md);
    font-size: 13.5px;
    line-height: 1.6;
  }
  .check-row input { margin-top: 3px; accent-color: var(--pink-deep); width: 16px; height: 16px; flex-shrink: 0; }
  .check-row a { color: var(--pink-deep); font-weight: 600; text-decoration: none; }
  .check-row a:hover { text-decoration: underline; }

  /* Buttons */
  .btn {
    padding: 14px 28px;
    border-radius: var(--radius-sm);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn svg { width: 16px; height: 16px; stroke-width: 2.2; }
  .btn-primary {
    background: var(--pink-deep);
    color: var(--white);
  }
  .btn-primary:hover { background: var(--pink); }
  .btn-primary:disabled {
    background: var(--gray-300);
    cursor: not-allowed;
  }
  .btn-full { width: 100%; padding: 16px 32px; font-size: 16px; }

  /* Auth screen */
  .auth-wrap {
    max-width: 460px;
    margin: 60px auto;
    padding: 0 24px;
    text-align: center;
  }
  .auth-card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-xl);
    padding: 40px 32px;
  }
  .auth-title {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--gray-800);
  }
  .auth-sub {
    color: var(--gray-500);
    font-size: 14px;
    margin-bottom: 28px;
  }
  #gsiButton { display: flex; justify-content: center; }
  .auth-note {
    margin-top: 24px;
    font-size: 12px;
    color: var(--gray-400);
    line-height: 1.6;
  }

  .error-msg {
    padding: 12px 16px;
    background: #FEF2F2;
    color: var(--red);
    border-radius: var(--radius-sm);
    font-size: 13px;
    margin: 8px 0;
    display: none;
  }
  .error-msg.show { display: block; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    background: var(--gray-800);
    color: var(--white);
    border-radius: var(--radius-md);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    font-size: 14px;
    font-weight: 600;
    display: none;
    z-index: 300;
  }
  .toast.show { display: block; animation: toast-in 0.2s; }
  .toast.toast-success { background: var(--green); }
  .toast.toast-error { background: var(--red); }
  @keyframes toast-in {
    from { opacity: 0; transform: translate(-50%, 20px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  /* Success screen */
  .success-wrap {
    max-width: 640px;
    margin: 60px auto;
    padding: 0 24px;
    text-align: center;
  }
  .success-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
    color: var(--green);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .success-icon svg { width: 40px; height: 40px; stroke-width: 2.5; }
  .success-title {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 900;
    color: var(--gray-800);
    margin-bottom: 12px;
  }
  .success-team {
    display: inline-block;
    padding: 8px 20px;
    background: var(--pink-bg);
    color: var(--pink-deep);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    border-radius: 100px;
    margin: 8px 0 24px;
    letter-spacing: 0.05em;
  }
  .success-sub {
    color: var(--gray-500);
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 32px;
  }
  .success-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn-outline {
    background: var(--white);
    color: var(--gray-700);
    border: 2px solid var(--gray-200);
  }
  .btn-outline:hover {
    border-color: var(--pink-deep);
    color: var(--pink-deep);
  }

  /* Loader overlay */
  .loader-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    z-index: 400;
  }
  .loader-overlay.show { display: flex; }
  .loader-spin {
    width: 48px;
    height: 48px;
    color: var(--pink-deep);
    animation: spin 1s linear infinite;
  }
  .loader-text {
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--gray-800);
    font-size: 16px;
  }
  .loader-sub {
    font-size: 13px;
    color: var(--gray-500);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="brand" title="回活動首頁">
      <span class="brand-logo-mark">n8n</span>
      <span class="brand-logo-text">Taiwan Open</span>
      <span class="brand-divider"></span>
      <span class="brand-pill" data-en="Finals Submission">決賽作品上傳</span>
    </a>
    <div style="display:flex; align-items:center; gap:12px;">
      <button type="button" class="lang-btn" id="langBtn" aria-label="Switch language">EN</button>
      <div class="signed-info" id="signedInfo" style="display:none;">
        <div class="signed-avatar" id="signedAvatar">?</div>
        <div>
          <div style="font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--gray-800);" id="signedName">—</div>
          <div style="font-size:11px; color:var(--gray-500);" id="signedEmail">—</div>
        </div>
        <button class="btn-tiny" onclick="signOut()" data-en="Sign out">登出</button>
      </div>
    </div>
  </div>
</header>

<div id="app">
  <div style="text-align:center; padding:80px 24px; color:var(--gray-500);">
    <i data-lucide="loader-circle" style="width:32px; height:32px; animation:spin 1s linear infinite;"></i>
    <p style="margin-top:16px;">載入中⋯</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="loader-overlay" id="loaderOverlay">
  <i data-lucide="loader-circle" class="loader-spin"></i>
  <div class="loader-text" id="loaderText">上傳中⋯</div>
  <div class="loader-sub" id="loaderSub">正在把檔案上傳到 Google Drive，請不要關閉分頁</div>
</div>

<!-- ============ Auth template ============ -->
<template id="tpl-auth">
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-title" data-en="Finals Submission">決賽作品上傳</h1>
      <p class="auth-sub" data-en="Sign in with Google to submit your project (any Google account works)">請先用 Google 帳號登入，才能提交作品（任一 Google 帳號皆可）</p>
      <div id="gsiButton"></div>
      <p class="auth-note" data-en="Your Google account email is logged for audit.<br>Questions? Contact Robin · 0911-436-467">系統會記錄提交人的 Google 帳號信箱作為稽核紀錄<br>如有問題請聯絡 Robin · 0911-436-467</p>
    </div>
  </div>
</template>

<!-- ============ Success template ============ -->
<template id="tpl-success">
  <div class="success-wrap">
    <div class="success-icon"><i data-lucide="check"></i></div>
    <h1 class="success-title" id="successTitle" data-en="Project received!">作品已收到！</h1>
    <div class="success-team" id="successTeamId">T???</div>
    <p class="success-sub" data-en="Confirmation email sent to your team leader's inbox · Organizer also notified.<br>To modify, re-upload with the same leader email and it will overwrite.<br><strong>Now wait for 16:50 · winners will be revealed live on the results page.</strong>">

      session.email = payload.email;

  // 修正 JWT payload 的中文亂碼：先 base64→bytes，再用 TextDecoder 以 UTF-8 解
  function decodeJwtPayload_(jwt) {
    const b64 = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
    const bin = atob(padded);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const jsonStr = new TextDecoder('utf-8').decode(bytes);
    return JSON.parse(jsonStr);
  }

          <div class="radio-group" id="modeGroup">
            <label class="radio-card">
              <input type="radio" name="mode" value="onsite" checked>
              <div>
                <div class="radio-card-title">現場出席</div>
                <div class="radio-card-desc">t.Hub Taipei 內科創新育成基地 · 08:30 開始報到 · 提供實體桌位、午餐、Wi-Fi</div>
              </div>
            </label>
            <label class="radio-card">
              <input type="radio" name="mode" value="remote">
              <div>
                <div class="radio-card-title">遠端連線</div>
                <div class="radio-card-desc">用 Google Meet 加入 · 第一輪遠端展示、第二輪遠端上台簡報 · 可爭取獎項</div>
              </div>
            </label>
          </div>
          <div id="remoteBlock" style="margin-top:20px; display:none; padding:16px 20px; background:var(--pink-soft); border-radius:var(--radius-md); font-size:13.5px; line-height:1.7; color:var(--gray-700);">
            ▶ <strong>遠端 Google Meet 連結</strong>（現場直播與遠端參賽共用）：
            <br>
            <a href="https://meet.google.com/sdx-abaj-jzp" target="_blank" rel="noopener" style="display:inline-block; margin-top:8px; padding:8px 14px; background:var(--white); border-radius:8px; color:var(--pink-deep); font-family:monospace; font-weight:600; text-decoration:none;">
              https://meet.google.com/sdx-abaj-jzp
            </a>
            <br>
            <span style="color:var(--gray-500); font-size:12.5px;">請於 8/7 08:45 前進入 Meet 準備 · 開幕 09:00 開始 · 建議提前測試設備與網路</span>
          </div>
        </section>

        <!-- Section 10: Consent -->
        <section class="section">
          <div class="section-head">
            <div class="section-num">10</div>
            <div>
              <div class="section-title" data-en="Participant Agreement">參賽同意書</div>
              <div class="section-desc" data-en="Please read carefully · ticking means all team members agree">請仔細閱讀，勾選代表全隊成員同意</div>
            </div>
          </div>
          <label class="check-row">
            <input type="checkbox" id="consent1">
            <span>
              我確認本隊<strong>至少 1 位成員已通過 n8n Level 1 國際認證</strong>，並已於上一步上傳該成員的證照檔案。
            </span>
          </label>
          <label class="check-row" style="margin-top:10px;">
            <input type="checkbox" id="consent2">
            <span>
              我同意作品著作權歸各隊成員所有，並授權主辦方於<strong>非商業性宣傳、展示、教學</strong>用途無償使用（含活動紀錄、媒體採訪、教育推廣）。
              作品可能被推薦至 <a href="https://n8n.io/workflows/" target="_blank" rel="noopener">n8n 官方 template 庫</a>。
            </span>
          </label>
          <label class="check-row" style="margin-top:10px;">
            <input type="checkbox" id="consent3">
            <span>
              我同意主辦方在得獎頁與作品展示頁公開展示本隊作品資訊（隊名、作品標題、簡介、作品影片、流程檔）。
            </span>
          </label>
        </section>

        <div class="error-msg" id="submitError"></div>

        <button type="button" class="btn btn-primary btn-full" onclick="submitForm()">
          <i data-lucide="upload"></i><span data-en="Submit Finals Project">送出決賽作品</span>
        </button>

        <p style="text-align:center; color:var(--gray-400); font-size:12px; margin-top:16px;" data-en="After submitting, files upload to Google Drive (10-30 seconds).<br>Please do not close or refresh the tab.">
          點送出後系統會把檔案上傳到 Google Drive，過程約 10-30 秒<br>
          期間請不要關閉或重整分頁
        </p>
      </div>
    `;
    renderMembers();
    lucide.createIcons();

    // Bind
    $('#addMemberBtn').addEventListener('click', addMember);
    $('#certUpload').addEventListener('click', () => $('#certInput').click());
    $('#certInput').addEventListener('change', (e) => onFilesChosen(e.target.files, 'certs'));
    $('#workflowUpload').addEventListener('click', () => $('#workflowInput').click());
    $('#workflowInput').addEventListener('change', (e) => onFilesChosen(e.target.files, 'workflows'));
    $('#readmeUpload').addEventListener('click', () => $('#readmeInput').click());
    $('#readmeInput').addEventListener('change', (e) => onFilesChosen(e.target.files, 'readmes'));
    bindDragDrop($('#certUpload'), 'certs');
    bindDragDrop($('#workflowUpload'), 'workflows');
    bindDragDrop($('#readmeUpload'), 'readmes');
    // Mode radio (onsite/remote)
    $$('input[name="mode"]').forEach(r => r.addEventListener('change', updateModeUI));
    updateModeUI();
  }

  function updateModeUI() {
    const r = document.querySelector('input[name="mode"]:checked')?.value;
    $$('#modeGroup .radio-card').forEach(c => c.classList.toggle('active', c.querySelector('input').checked));
    $('#remoteBlock').style.display = (r === 'remote') ? '' : 'none';
  }

  /* -----------------------------------------------------
     Members
     ----------------------------------------------------- */
  function renderMembers() {
    $('#membersList').innerHTML = members.map((m, i) => `
      <div class="member-item" data-idx="${i}">
        <div class="member-head">
          <span class="member-num">${i === 0 ? '隊長' : '成員 ' + (i + 1)}</span>
          ${i >= 1 ? `<button type="button" class="btn-remove-member" onclick="removeMember(${i})"><i data-lucide="x"></i><span>移除</span></button>` : ''}
        </div>
        <div class="row row-2">
          <div><label class="label">姓名 <span class="req">*</span></label><input class="input m-name" value="${escAttr(m.name)}"></div>
          <div><label class="label">學校</label><input class="input m-school" value="${escAttr(m.school)}" placeholder="${i === 0 ? '同隊長學校' : ''}"></div>
        </div>
        <div class="row row-3">
          <div><label class="label">系所</label><input class="input m-dept" value="${escAttr(m.dept)}"></div>
          <div><label class="label">年級</label><input class="input m-year" value="${escAttr(m.year)}" placeholder="例：大三"></div>
          <div><label class="label">電子信箱</label><input class="input m-email" value="${escAttr(m.email)}"></div>
        </div>
      </div>
    `).join('');
    lucide.createIcons();
    // Bind inputs
    $$('.member-item').forEach(el => {
      const i = Number(el.dataset.idx);
      el.querySelector('.m-name').addEventListener('input', e => members[i].name = e.target.value);
      el.querySelector('.m-school').addEventListener('input', e => members[i].school = e.target.value);
      el.querySelector('.m-dept').addEventListener('input', e => members[i].dept = e.target.value);
      el.querySelector('.m-year').addEventListener('input', e => members[i].year = e.target.value);
      el.querySelector('.m-email').addEventListener('input', e => members[i].email = e.target.value);
    });
    $('#addMemberBtn').disabled = members.length >= 4;
  }

  function addMember() {
    if (members.length >= 4) return;
    members.push({ name: '', school: '', dept: '', year: '', email: '' });
    renderMembers();
  }
  window.removeMember = function(i) {
    // 至少留 1 位（隊長）
    if (i < 1 || members.length <= 1) return;
    members.splice(i, 1);
    renderMembers();
  };

  /* -----------------------------------------------------
     File uploads
     ----------------------------------------------------- */
  function bindDragDrop(zone, kind) {
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault(); zone.classList.remove('dragover');
      onFilesChosen(e.dataTransfer.files, kind);
    });
  }

  async function onFilesChosen(files, kind) {
    for (const f of files) {
      if (kind === 'certs') {
        if (certs.length >= MAX_CERTS) { toast('證照最多 ' + MAX_CERTS + ' 張', 'error'); break; }
        if (f.size > MAX_CERT_MB * 1024 * 1024) { toast(`${f.name} 超過 ${MAX_CERT_MB}MB`, 'error'); continue; }
        const dataUrl = await readAsDataURL(f);
        certs.push({ file: f, dataUrl });
      } else if (kind === 'workflows') {
        if (workflows.length >= MAX_WORKFLOWS) { toast('流程檔最多 ' + MAX_WORKFLOWS + ' 份', 'error'); break; }
        if (f.size > MAX_WORKFLOW_MB * 1024 * 1024) { toast(`${f.name} 超過 ${MAX_WORKFLOW_MB}MB`, 'error'); continue; }
        const dataUrl = await readAsDataURL(f);
        workflows.push({ file: f, dataUrl });
      } else if (kind === 'readmes') {
        if (readmes.length >= MAX_READMES) { toast('README 最多 ' + MAX_READMES + ' 份', 'error'); break; }
        if (f.size > MAX_README_MB * 1024 * 1024) { toast(`${f.name} 超過 ${MAX_README_MB}MB`, 'error'); continue; }
        const dataUrl = await readAsDataURL(f);
        readmes.push({ file: f, dataUrl });
      }
    }
    renderFileLists();
    // Reset input so same file can be re-added
    $('#certInput').value = '';
    $('#workflowInput').value = '';
    $('#readmeInput').value = '';
  }

  function readAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsDataURL(file);
    });
  }

  function renderFileLists() {
    $('#certList').innerHTML = certs.map((c, i) => {
      const isImg = (c.file.type || '').startsWith('image/');
      const preview = isImg
        ? `<img class="cert-thumb" src="${c.dataUrl}" alt="${escAttr(c.file.name)}">`
        : `<div class="cert-thumb" style="display:flex;align-items:center;justify-content:center;background:var(--gray-100);color:var(--text-dim);"><i data-lucide="file-check-2" style="width:32px;height:32px;"></i></div>`;
      return `
      <div class="cert-tile">
        ${preview}
        <button type="button" class="file-item-remove" onclick="removeFile('certs', ${i})"><i data-lucide="x"></i></button>
        <div class="cert-tile-name">${esc(c.file.name)}</div>
      </div>`;
    }).join('');
    $('#workflowList').innerHTML = workflows.map((w, i) => `
      <div class="file-item">
        <i data-lucide="file-code-2"></i>
        <span class="file-item-name">${esc(w.file.name)}</span>
        <span class="file-item-size">${fmtSize(w.file.size)}</span>
        <button type="button" class="file-item-remove" onclick="removeFile('workflows', ${i})"><i data-lucide="x"></i></button>
      </div>
    `).join('');
    $('#readmeList').innerHTML = readmes.map((r, i) => `
      <div class="file-item">
        <i data-lucide="file-text"></i>
        <span class="file-item-name">${esc(r.file.name)}</span>
        <span class="file-item-size">${fmtSize(r.file.size)}</span>
        <button type="button" class="file-item-remove" onclick="removeFile('readmes', ${i})"><i data-lucide="x"></i></button>
      </div>
    `).join('');
    lucide.createIcons();
  }

  window.removeFile = function(kind, i) {
    if (kind === 'certs') certs.splice(i, 1);
    else if (kind === 'workflows') workflows.splice(i, 1);
    else if (kind === 'readmes') readmes.splice(i, 1);
    renderFileLists();
  };

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }

  /* -----------------------------------------------------
     Submit
     ----------------------------------------------------- */
  async function submitForm() {
    const err = $('#submitError');
    err.classList.remove('show');
    err.textContent = '';

    // Collect data
    const data = {
      teamName: $('#teamName').value.trim(),
      theme: Number($('#theme').value),
      title: $('#workTitle').value.trim(),
      summary: $('#workSummary').value.trim(),
      leader: {
        name: $('#leaderName').value.trim(),
        school: $('#leaderSchool').value.trim(),
        email: $('#leaderEmail').value.trim(),
        phone: $('#leaderPhone').value.trim(),
        line: $('#leaderLine').value.trim()
      },
      members: members.map(m => ({
        name: (m.name || '').trim(),
        school: (m.school || '').trim(),
        dept: (m.dept || '').trim(),
        year: (m.year || '').trim(),
        email: (m.email || '').trim()
      })),
      teacherName: $('#teacherName').value.trim(),
      referralCode: $('#referralCode').value.trim().toUpperCase(),
      videoUrl: $('#videoUrl').value.trim(),
      pitchUrl: $('#pitchUrl').value.trim(),
      runtime: 'cloud',
      cloudUrl: $('#cloudUrl').value.trim(),
      localDeps: '',
      mode: document.querySelector('input[name="mode"]:checked')?.value || 'onsite',
      consent: $('#consent1').checked && $('#consent2').checked && $('#consent3').checked
    };

    // Copy leader details into member[0] if empty
    if (data.members[0]) {
      if (!data.members[0].name) data.members[0].name = data.leader.name;
      if (!data.members[0].school) data.members[0].school = data.leader.school;
      if (!data.members[0].email) data.members[0].email = data.leader.email;
    }

    // Validate
    if (!data.teamName) return showErr('請填隊名');
    if (!data.theme) return showErr('請選題目類別');
    if (!data.title) return showErr('請填作品標題');
    if (!data.leader.name || !data.leader.school || !data.leader.email || !data.leader.phone) return showErr('請完整填寫隊長資訊');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.leader.email)) return showErr('隊長 Email 格式不對');
    if (data.members.filter(m => m.name).length < 1) return showErr('至少要有 1 位成員（隊長）');
    if (certs.length < 1) return showErr('每隊至少需上傳 1 張 n8n Level 1 認證證照 PNG（隊中至少 1 位持有即可）');
    if (workflows.length === 0) return showErr('至少要上傳 1 份 n8n 流程檔');
    if (!data.videoUrl) return showErr('請填作品展示影片連結');
    if (!data.cloudUrl) return showErr('請填 Learning 流程網址（所有作品都必須在 Learning 上跑）');
    if (!data.consent) return showErr('請勾選全部 3 項同意書');

    // Build payload
    const certPayload = certs.map(c => ({
      filename: c.file.name,
      mimeType: c.file.type || 'image/png',
      data: c.dataUrl.split(',')[1]  // base64 part only
    }));
    const workflowPayload = workflows.map(w => ({
      filename: w.file.name,
      mimeType: w.file.type || 'application/json',
      data: w.dataUrl.split(',')[1]
    }));
    const readmePayload = readmes.map(r => ({
      filename: r.file.name,
      mimeType: r.file.type || 'text/markdown',
      data: r.dataUrl.split(',')[1]
    }));

    const totalCount = certs.length + workflows.length + readmes.length;
    const totalMb = (
      certs.reduce((s, c) => s + c.file.size, 0) +
      workflows.reduce((s, w) => s + w.file.size, 0) +
      readmes.reduce((s, r) => s + r.file.size, 0)
    ) / 1024 / 1024;
    showLoader('上傳中⋯', `正在把 ${totalCount} 個檔案（共 ${totalMb.toFixed(1)}MB）上傳到 Google Drive`);

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'finals-submit',
          idToken: session.idToken,
          data,
          certs: certPayload,
          workflows: workflowPayload,
          readmes: readmePayload
        })
      });
      const result = await res.json();
      hideLoader();
      if (result.ok) {
        showSuccess(result);
      } else {
        showErr(result.message || '送出失敗');
      }
    } catch (e) {
      hideLoader();
      showErr('連線錯誤：' + e.message);
    }
  }

  function showErr(msg) {
    const err = $('#submitError');
    err.textContent = '● ' + msg;
    err.classList.add('show');
    err.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function showSuccess(result) {
    const tpl = document.getElementById('tpl-success');
    $('#app').innerHTML = '';
    $('#app').appendChild(tpl.content.cloneNode(true));
    $('#successTitle').textContent = result.isUpdate ? '作品已更新！' : '作品已收到！';
    $('#successTeamId').textContent = result.teamId;
    lucide.createIcons();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escAttr(s) { return esc(s); }

  /* -----------------------------------------------------
     Language Toggle (中文 / EN)
     ----------------------------------------------------- */
  (function () {
    const STORAGE_KEY = 'site-lang';
    const btn = document.getElementById('langBtn');
    if (!btn) return;
    function applyLang(lang) {
      document.documentElement.lang = (lang === 'en') ? 'en' : 'zh-Hant';
      document.querySelectorAll('[data-en]').forEach(function (el) {
        if (el.dataset.zh === undefined) el.dataset.zh = el.innerHTML;
        el.innerHTML = (lang === 'en') ? el.dataset.en : el.dataset.zh;
      });
      document.querySelectorAll('[data-en-placeholder]').forEach(function (el) {
        if (el.dataset.zhPlaceholder === undefined) el.dataset.zhPlaceholder = el.placeholder;
        el.placeholder = (lang === 'en') ? el.dataset.enPlaceholder : el.dataset.zhPlaceholder;
      });
      btn.textContent = (lang === 'en') ? '中文' : 'EN';
      try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) {}
      if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
    }
    btn.addEventListener('click', function () {
      const current = (document.documentElement.lang === 'en') ? 'en' : 'zh';
      applyLang(current === 'en' ? 'zh' : 'en');
    });
    // Init from localStorage · MutationObserver so dynamically rendered content also gets translated
    try { if (localStorage.getItem(STORAGE_KEY) === 'en') applyLang('en'); } catch (e) {}
    // Re-apply after form re-renders (renderForm swaps innerHTML wholesale)
    const app = document.getElementById('app');
    if (app) {
      new MutationObserver(function () {
        const cur = (document.documentElement.lang === 'en') ? 'en' : 'zh';
        if (cur === 'en') applyLang('en');
      }).observe(app, { childList: true });
    }
  })();
</script>

</body>
